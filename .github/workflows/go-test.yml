name: Go tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./...
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: OpenAPI path coverage
        run: go test ./internal/server/ -run 'TestOpenAPI|TestServerAPIV1' -count=1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Vue SPA
        run: npm --prefix web ci && npm --prefix web run build
