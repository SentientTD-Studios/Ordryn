name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-web:
    name: Build and attach web distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web distribution
        run: npm run build:web

      - name: Verify web output
        run: test -f web/dist/index.html

      - name: Package web distribution
        run: |
          cd web/dist
          zip -r "../../web-dist-${{ github.event.release.tag_name }}.zip" .

      - name: Attach web distribution to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: web-dist-${{ github.event.release.tag_name }}.zip

  build-server:
    name: Build server (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: gotodo-linux-amd64
          - goos: windows
            goarch: amd64
            artifact: gotodo-windows-amd64.exe

    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >
          go build -trimpath
          -ldflags "-s -w -X GoTodo/internal/version.Version=${{ github.event.release.tag_name }}"
          -o "${{ matrix.artifact }}" .

      - name: Attach server binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.artifact }}
