      tags: [Projects]
      summary: Get a project (owned or shared)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
