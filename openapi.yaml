    SavedView:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        filter:
          $ref: "#/components/schemas/SavedViewFilter"
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        scope:
          type: string
          enum: [personal, organization, site]
          description: >
            Who can open the query: only its owner, the members of `organization_id`,
            or everyone on the site. Each viewer runs it with their own access, so a
            shared query never shows anyone a task they could not already open.
        organization_id:
          type: integer
          nullable: true
          description: Set when `scope` is `organization`.
        organization_name:
          type: string
        shared:
          type: boolean
          description: True for organization and site queries.
        is_owner:
          type: boolean
        author_name:
          type: string
          description: Who created a shared query.
        can_edit:
          type: boolean
          description: >
            Personal queries: their owner. Organization queries: their owner while a
            member, admins, people who manage the organization, and members whose role
            has `queries:manage`. Site queries: holders of `queries:site`.
        on_dashboard:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SavedViewCreate:
      type: object
      required: [name]
      description: Send a `definition`, or (older clients) a `filter` that is converted to one.
      properties:
        name:
          type: string
        filter:
          $ref: "#/components/schemas/SavedViewFilter"
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        scope:
          type: string
          enum: [personal, organization, site]
          default: personal
          description: >
            `organization` needs `organization_id` and membership of it; `site` needs
            `queries:site`. Limit which projects it searches in `definition.scope`.
        organization_id:
          type: integer
        sort_order:
          type: integer

    SavedViewPatch:
      type: object
      properties:
        name:
          type: string
        filter:
          $ref: "#/components/schemas/SavedViewFilter"
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        scope:
          type: string
          enum: [personal, organization, site]
          description: Move the query to another audience. Only its owner can, and only to one they may share with.
        organization_id:
          type: integer
        sort_order:
          type: integer

    QueryDefinition:
      type: object
      properties:
        version:
          type: integer
          enum: [2]
        scope:
          type: object
          properties:
            projects:
              type: array
              items: { type: integer }
              description: >
                Limit to these projects. With `organizations` the two lists add up; with
                both empty the query covers every project you can open.
            organizations:
              type: array
              items: { type: integer }
              description: >
                Add every project of these organizations that you can open. You must
                belong to each one.
            include_personal:
              type: boolean
              description: Include your tasks without a project (default true).
            include_archived:
              type: boolean
            exclude_view_only:
              type: boolean
        where:
          $ref: "#/components/schemas/QueryNode"
        mode:
          type: string
          enum: [flat, tree]
        columns:
          type: array
          items: { type: string }
        sort:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              field: { type: string }
              dir: { type: string, enum: [asc, desc] }

    QueryNode:
      type: object
      description: >
        A group (`op` and `clauses`) or a clause (`field`, `operator`, `value`). Every row in a group
        but the first has a `join` ("and" or "or") connecting it to the row above; AND binds tighter
        than OR, so "A and B or C" is "(A and B) or C" (nest a group to change that). A row without a
        join uses its group's `op`. Fields include id,
        title, description, text, project, completed, workflow_status, priority, tags, due_date,
        created_date, modified_date, completed_date, status_changed_date, days_in_status, claimed_by, reviewer, created_by, sprint, estimate,
        is_subtask, has_subtasks, favorite and cf:<custom field key>. Date values accept YYYY-MM-DD
        or macros such as @today-7, @start_of_week and @end_of_week; `between` (dates only) takes [from, to] and includes both ends; people accept @me; sprints accept @current_sprint.
      properties:
        join: { type: string, enum: [and, or] }
        op: { type: string, enum: [and, or] }
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/QueryNode"
        field: { type: string }
        operator:
          type: string
          enum: ["=", "<>", "<", "<=", ">", ">=", in, not_in, contains, not_contains, is_empty, is_not_empty, between]
        value: {}

    QueryRunRequest:
      type: object
      required: [definition]
      properties:
        definition:
          $ref: "#/components/schemas/QueryDefinition"
        project_id:
          type: integer
          description: Pin the run to one project, ignoring the definition's scope.
        page: { type: integer }
        page_size: { type: integer }

    QueryResults:
      type: object
      properties:
