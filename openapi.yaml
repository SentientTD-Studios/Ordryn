        parent_id:
          type: integer
          nullable: true
          description: Set to a root task id to nest, or null to promote to root
        priority:
          type: integer
        completed:
          type: boolean
        tag_ids:
          type: array
          items:
            type: integer
        status_id:
          type: integer
          nullable: true
        estimate_points:
          type: integer
          nullable: true
        sprint_id:
          type: integer
          nullable: true
          description: Set a sprint in the task's kanban project. null or 0 moves the task to the backlog; omit to leave the assignment unchanged. After a sprint lock date, only the project owner can assign tasks to that sprint.
        fields:
          type: object
          additionalProperties: true
          description: Merge custom field values. Omitted keys are unchanged; JSON null clears a key.
        recurrence:
          allOf:
            - $ref: "#/components/schemas/TaskRecurrenceInput"
          nullable: true
          description: Set the repeat rule, or null to stop repeating. Omit to leave unchanged.

