        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Admin]
      summary: Retry a failed or dead site delivery
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/admin/join-requests:
    get:
      tags: [Admin]
      summary: List join requests
      description: Not available on a company site (404); accounts there come from people managers.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Join requests (pending first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"

  /api/v2/admin/join-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Approve a pending join request
      description: Creates or reuses a site invite and emails the requester.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    $ref: "#/components/schemas/JoinRequest"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/admin/join-requests/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Deny a pending join request
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    $ref: "#/components/schemas/JoinRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/admin/invites:
    get:
      tags: [Admin]
      summary: List all invites (admin)
      description: Not available on a company site (404); accounts there come from people managers.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: All invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      tags: [Admin]
      summary: Create an invite (admin)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                expires_at:
                  type: string
                  format: date-time
                bypass_expiration:
                  type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /api/v2/admin/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [Admin]
      summary: Delete an unused invite (admin)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key from profile, bootstrap, device auth, or a project's API keys panel
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: httpOnly session cookie from /api/v2/auth/login or register

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    FeedbackPostID:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

    FeedbackSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
      description: Unguessable public board slug

    AgentID:
      name: agentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RunID:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource is in a conflicting state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    APIError:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FeedbackPostResponse:
      description: Updated submission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeedbackPost"
    FeedbackVoteResponse:
      description: Vote saved
      content:
        application/json:
          schema:
            type: object
            properties:
              vote_count:
                type: integer
              voted:
                type: boolean

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code (e.g. invalid_request)
        message:
          type: string

    OK:
      type: object
      properties:
        ok:
          type: boolean

    TaskReorderResult:
      type: object
      properties:
        ok:
          type: boolean

    Health:
      type: object
      properties:
        version:
          type: string
          description: Application version (git release tag). Checkouts use the latest reachable tag; unstamped builds without git tags report "dev".
        api_enabled:
          type: boolean
        redis_ok:
          type: boolean
        mode:
          type: string
          enum: [full, api]

    SiteInfo:
      type: object
      properties:
        site_name:
          type: string
        show_changelog:
          type: boolean
        enable_global_announcement:
          type: boolean
        global_announcement_text:
          type: string
        announcement_dismissed:
          type: boolean
        enable_registration:
          type: boolean
        invite_only:
          type: boolean
        enable_join_requests:
          type: boolean
        meta_description:
          type: string
        github_oauth_configured:
          type: boolean
        image_hosting_enabled:
          type: boolean
          description: True when an admin has configured S3 or local image hosting
        image_max_bytes:
          type: integer
          format: int64
          description: Maximum upload size in bytes when image hosting is enabled
        allow_user_invites:
          type: boolean
        user_invite_limit:
          type: integer
        invite_expiration_days:
          type: integer
        enable_inbound_webhooks:
          type: boolean
          description: True when an admin has allowed public inbound webhooks.
        max_description_length:
          type: integer
          description: Maximum task description length in characters (site-configurable, default 20000).
        max_comment_length:
          type: integer
          description: Maximum task comment length in characters (site-configurable, default 20000).
        attachments_enabled:
          type: boolean
          description: Whether members may upload files to tasks.
        attachment_max_bytes:
          type: integer
          description: Largest file a member may attach, in bytes.
        site_mode:
          type: string
          enum: [multi, company]
          description: multi lets anyone allowed create organizations; company runs the site as one company with admin-created teams.
        setup_required:
          type: boolean
          description: True until first-time setup (POST /api/v2/setup) creates the admin account.
        sso_enabled:
          type: boolean
          description: Single sign-on is set up; show "Sign in with {sso_label}".
        sso_label:
          type: string
        sso_only:
          type: boolean
          description: Password sign-in and self-registration are off for everyone but admins.
        min_password_length:
          type: integer
          description: Minimum length for new passwords (security policy).
        maintenance:
          type: boolean
          description: The site is read-only for everyone but admins.
        maintenance_message:
          type: string

    ProjectAccess:
      type: object
      properties:
        shares:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              kind: { type: string, enum: [team, person] }
              team_id: { type: integer }
              user_id: { type: integer }
              name: { type: string, description: Team name, or the person's full name (else username) }
              email: { type: string }
              user_name: { type: string, description: The person's username (person shares) }
              level: { type: string, enum: [full, view] }
              role_id: { type: integer, description: Role a full share gives; absent means each person's own }
              role_label: { type: string }
              is_company: { type: boolean }
              member_count: { type: integer }
              created_at: { type: string, format: date-time }
        can_manage: { type: boolean }
        teams:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              is_company: { type: boolean }
        roles:
          type: array
          description: Roles a full share can give
          items:
            type: object
            properties:
              id: { type: integer }
              label: { type: string }

    NotificationPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [type, label, description, enabled, email, email_available]
            properties:
              type:
                type: string
                enum: [task_created, task_commented, task_mentioned, task_activity, task_unblocked, due_reminder, automation, join_request]
              label:
                type: string
              description:
                type: string
              enabled:
                type: boolean
                description: Delivered in-app.
              email:
                type: boolean
                description: Also emailed (needs enabled, email_mode other than off, and email.available).
              email_available:
                type: boolean
                description: False for types that cannot be emailed on their own (automation, join_request).
        email:
          type: object
          required: [available, mode, digest_hour, reminder_timing]
          properties:
            available:
              type: boolean
              description: True when an admin enabled notification email and outbound mail is configured.
            mode:
              type: string
              enum: [off, instant, digest]
              description: |
                instant batches unread notifications into at most one email per 10 minutes,
                skipping any read in-app first; digest sends one email a day at digest_hour.
            digest_hour:
              type: integer
            reminder_timing:
              type: string
              enum: [off, day_before, morning, both]
              description: When due-date reminders arrive, at 08:00 in the user's timezone.

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        user_name:
          type: string
        first_name:
          type: string
          description: Company mode; set by whoever manages names
        last_name:
          type: string
        timezone:
          type: string
        items_per_page:
          type: integer
        permissions:
          type: array
          items:
            type: string
        allow_project_invites:
          type: boolean
        home_split_view:
          type: boolean
          description: When true, Home shows a grid of projects above the task list (default false)
          description: When false, the user cannot be invited to shared projects
        username_change_available:
          type: boolean
          description: When true, the user may call POST /api/v2/me/username once
        mfa_enabled:
          type: boolean
          description: When true, password login requires a TOTP or recovery code
        avatar_url:
          type: string
          description: URL to user's uploaded profile picture, or empty if unset
        is_site_owner:
          type: boolean
          description: True for the one account above admins (by default whoever ran first-time setup).
        manages_people:
          type: boolean
          description: True when the user gets the People page (admin, users:manage, team:people on a company-mode team, or people:profile).
        can_edit_name:
          type: boolean
          description: Company mode; true when the user may set their own first and last name (people:profile).
        is_guest:
          type: boolean
          description: Company mode; a guest account from outside the company.

    GuestPolicy:
      type: object
      properties:
        enabled: { type: boolean }
        access_level: { type: string, enum: [view, full] }
        role_id:
          type: integer
          nullable: true
          description: Site role guests get on full shares (required for `full`).
        via_teams: { type: boolean }
        directory: { type: boolean }
        guest_count:
          type: integer
          readOnly: true

    MFARequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          enum: [true]

    MFAStatus:
      type: object
      properties:
        enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer

    MFASetup:
      type: object
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
          format: uri

    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP or a recovery code (XXXXX-XXXXX)

    MFARecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string

    UserSearchHit:
      type: object
      required: [user_name]
      properties:
        user_name:
          type: string
        is_team:
          type: boolean
          description: True for a team handle (only with `include_teams=1`).

    UserPatch:
      type: object
      properties:
        timezone:
          type: string
        items_per_page:
          type: integer
          enum: [10, 15, 25, 50]
        allow_project_invites:
          type: boolean
        home_split_view:
          type: boolean
          description: Show a grid of projects above the task list on Home

    RegisterRequest:
      type: object
      required: [email, password, confirm_password, user_name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        confirm_password:
          type: string
        user_name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Unique username; immutable after registration except by admin
        timezone:
          type: string
        invite_token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          enum: [standard, local_agent]
        scopes:
          type: array
          description: Empty for standard keys
          items:
            type: string
        project_id:
          type: integer
          nullable: true
          description: The one project a local agent key is limited to
        project_name:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        expired:
          type: boolean

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext key; shown only once

    ProjectAPIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [tasks:read, tasks:write, comments:write]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        expired:
          type: boolean
        created_by_id:
          type: integer
        created_by:
          type: string
          description: Creator's username or email

    ProjectAPIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ProjectAPIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext key; shown only once

    AgentInput:
      type: object
      description: Agent settings. On PATCH, omitted fields keep their value.
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 500
        instructions:
          type: string
          maxLength: 8000
          description: Standing directions sent with every run
        enabled:
          type: boolean
          description: Paused agents get no runs and their keys are refused
        role:
          type: string
          description: Project role slug; roles with project:manage are refused
        webhook_url:
          type: string
          description: Public HTTPS URL to POST runs to; empty for queue/MCP-only agents
        trigger_on_mention:
          type: boolean
        trigger_status_ids:
          type: array
          items:
            type: integer
          description: Moving a task into one of these columns starts a run
        trigger_by:
          type: string
          enum: [managers, writers, selected]
          description: |
            Who may start runs (by mention, column move, or Send to agent). With `selected`,
            only callers whose role is in `trigger_role_slugs` or whose id is in
            `trigger_user_ids` may; managers are not implied. Anyone else is ignored.
        trigger_role_slugs:
          type: array
          items:
            type: string
          description: Project role slugs that may call the agent (trigger_by `selected`)
        trigger_user_ids:
          type: array
          items:
            type: integer
          description: Project members who may call the agent (trigger_by `selected`)
        claim_on_dispatch:
          type: boolean
          description: Claim the kanban card for the agent while a run is open
        allowed_status_ids:
          type: array
          items:
            type: integer
          description: Columns the agent may move tasks into; empty means any non-done column
        editable_fields:
          type: array
          items:
            type: string
            enum: [status, title, description, priority, due_date, tags, estimate, sprint, custom_fields]
        can_complete:
          type: boolean
          description: Allow completing/reopening tasks and moving them into done columns
        can_create_tasks:
          type: boolean
          description: Allow creating tasks and subtasks, and re-parenting tasks
        can_comment:
          type: boolean
        max_runs_per_hour:
          type: integer
          minimum: 1
          maximum: 500

    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentInput"
        - type: object
          properties:
            id:
              type: integer
            project_id:
              type: integer
            user_id:
              type: integer
              description: The agent's member account
            handle:
              type: string
            role_name:
              type: string
            webhook_secret_set:
              type: boolean
            last_delivery_at:
              type: string
              format: date-time
              nullable: true
            last_delivery_error:
              type: string
            created_by_id:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    AutomationTriggerConfig:
      type: object
      properties:
        days:
          type: integer
          minimum: 0
          maximum: 365
          description: Threshold for timed triggers (time.*).
        from_status_ids:
          type: array
          items:
            type: integer
          description: task.status_changed only — the column the task left.
        to_status_ids:
          type: array
          items:
            type: integer
          description: task.status_changed only — the column the task entered.
        tag_ids:
          type: array
          items:
            type: integer
          description: task.tagged only — fire when one of these tags is added.

    AutomationConditions:
      type: object
      description: The rule's "if" filters. Every set filter must match.
      properties:
        status_ids:
          type: array
          items:
            type: integer
        exclude_status_ids:
          type: array
          items:
            type: integer
        min_priority:
          type: integer
          minimum: 0
          maximum: 3
        tags_any:
          type: array
          items:
            type: integer
        tags_none:
          type: array
          items:
            type: integer
        sprint:
          type: string
          enum: ["", none, current, any, specific]
        sprint_id:
          type: integer
        assignee:
          type: string
          enum: ["", unassigned, assigned, user]
        assignee_id:
          type: integer
        field_key:
          type: string
        field_value:
          type: string
        has_due:
          type: string
          enum: ["", "yes", "no"]
        completion:
          type: string
          enum: ["", open, done]
        task_kind:
          type: string
          enum: ["", root, subtask]

    AutomationAction:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [set_status, set_priority, add_tag, remove_tag, assign, unassign, set_sprint, set_due,
            complete, reopen, archive, comment, notify, queue_agent]
        status_id:
          type: integer
        priority:
          type: integer
          minimum: 0
          maximum: 3
        tag_id:
          type: integer
        user_id:
          type: integer
          description: assign — a human project member.
        sprint:
          type: string
          enum: [current, next, backlog, specific]
        sprint_id:
          type: integer
        days:
          type: integer
          description: set_due — days from today (project owner's timezone).
        body:
          type: string
          description: |
            comment / notify text, or the note for queue_agent. Supports {task}, {id}, {status}, {priority},
            {due_date}, {assignee}, {sprint}, {project}, {tags}, {rule}, {today}, {url}, {description}.
        target:
          type: string
          enum: [watchers, assignee]
        agent_id:
          type: integer

    AutomationRuleInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        enabled:
          type: boolean
        trigger_type:
          type: string
          enum: [task.created, task.status_changed, task.completed, task.reopened, task.claimed, task.unclaimed,
            task.due_changed, task.tagged, task.sprint_changed, task.commented, task.unblocked,
            time.overdue, time.due_soon, time.completed_ago, time.in_status, time.inactive, time.sprint_ended]
        trigger_config:
          $ref: "#/components/schemas/AutomationTriggerConfig"
        conditions:
          $ref: "#/components/schemas/AutomationConditions"
        actions:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AutomationAction"
        recipe_id:
          type: string
          description: Built-in recipe the rule was started from (informational).

    AutomationRule:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        position:
          type: integer
        trigger_type:
          type: string
        trigger_config:
          $ref: "#/components/schemas/AutomationTriggerConfig"
        conditions:
          $ref: "#/components/schemas/AutomationConditions"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/AutomationAction"
        recipe_id:
          type: string
        created_by_id:
          type: integer
        updated_by_id:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        run_count:
          type: integer
        error_count:
          type: integer
        consecutive_errors:
          type: integer
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
        paused_reason:
          type: string
          description: Set when the system paused the rule (error streak or hourly limit).

    AutomationRun:
      type: object
      properties:
        id:
          type: integer
        rule_id:
          type: integer
        rule_name:
          type: string
        project_id:
          type: integer
        task_id:
          type: integer
        task_title:
          type: string
        trigger:
          type: string
        outcome:
          type: string
          enum: [applied, error]
        changes:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
              field:
                type: string
              from:
                type: string
              to:
                type: string
              error:
                type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time

    AgentRun:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
