  /api/v2/projects/{id}/statuses/{statusId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: statusId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Projects]
      summary: Update a status column (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_done:
                  type: boolean
                is_default:
                  type: boolean
                wip_limit:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 999
                  description: Soft card limit for the column; null clears it. Rejected on done columns, and cleared when a column becomes done.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatus"
    delete:
      tags: [Projects]
      summary: Delete a status column (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: move_to_status_id
          in: query
          schema:
            type: integer
          description: Required when tasks remain in the column
      responses:
        "204":
          description: Deleted

  /api/v2/projects/{id}/statuses/{statusId}/gates:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: statusId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Projects]
      summary: Set which roles may enter or leave this status (owner)
      description: |
        Empty arrays mean any member with `tasks:status` can move that direction.
        Project owners and site admins always bypass gates. The owner slug is implied
        and does not need to be listed.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusGatesBody"
      responses:
        "200":
          description: Updated gates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusGatesBody"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}/sprints:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: List sprints for a kanban project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Sprints (empty when project is classic)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSprint"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: Create a sprint (owner, kanban only, max 50)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 80
                  description: Optional short goal shown with the sprint name (e.g. "features required for v3.0.0 release")
                start_date:
                  type: string
                  format: date
                  description: Inclusive start (YYYY-MM-DD). Leave blank or omit for a dateless sprint (e.g. Icebox). For dated sprints, must not overlap another sprint in this project.
                end_date:
                  type: string
                  format: date
                  description: Inclusive end (YYYY-MM-DD). Leave blank or omit for a dateless sprint. Adjacent ranges (next day after another sprint ends) are allowed.
                lock_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. From this UTC date onward, only the project owner can add tasks to the sprint. Cannot be set on dateless sprints. Omit or null to leave the sprint unlocked.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSprint"
        "400":
          description: Invalid dates, inverted range, or overlap with another sprint
        "409":
          description: Sprint limit or name conflict

  /api/v2/projects/{id}/sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: sprintId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Projects]
      summary: Update a sprint (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 80
                  description: Optional short goal shown with the sprint name. Empty string clears it.
                start_date:
                  type: string
                  format: date
                  description: Inclusive start (YYYY-MM-DD). Must not overlap another sprint in this project.
                end_date:
                  type: string
                  format: date
                  description: Inclusive end (YYYY-MM-DD). Adjacent ranges are allowed.
                lock_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. From this UTC date onward, only the project owner can add tasks. Null or empty clears the lock date.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSprint"
    delete:
      tags: [Projects]
      summary: Delete a sprint (owner). Tasks go to backlog unless moved.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: move_to_sprint_id
          in: query
          schema:
            type: integer
          description: Optional destination sprint; 0 or omit leaves tasks in the backlog
      responses:
        "204":
          description: Deleted

  /api/v2/projects/{id}/sprints/backlog:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Get the backlog system sprint for a kanban project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Backlog system sprint details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 0
                  project_id:
                    type: integer
                  name:
                    type: string
                    example: "Backlog"
                  description:
                    type: string
                    maxLength: 80
                    example: "Cold storage for future features"
                  is_active:
                    type: boolean
                    example: false
                  is_locked:
                    type: boolean
                    example: false
                  is_system:
                    type: boolean
                    example: true
                  task_count:
                    type: integer
        "400":
          description: Project is not in kanban mode
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      summary: Update the backlog system sprint (owner)
      description: Updates the backlog system sprint name and/or description. Cannot set start, end, or lock dates.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                  description: New name for the backlog system sprint
                description:
                  type: string
                  maxLength: 80
                  description: New description for the backlog system sprint
      responses:
        "200":
          description: Backlog system sprint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 0
                  project_id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  is_active:
                    type: boolean
                  is_locked:
                    type: boolean
                  is_system:
                    type: boolean
                  task_count:
                    type: integer
        "400":
          description: Invalid request or attempt to set dates
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

