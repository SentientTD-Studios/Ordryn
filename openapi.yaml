        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
    delete:
      tags: [Saved Views]
      summary: Delete a saved view
      security:
        - SessionCookie: []
        - BearerAuth: []
