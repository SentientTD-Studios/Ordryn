      summary: Month grid of tasks with due dates (open and completed)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
          description: Year-month to display (YYYY-MM). Defaults to the current month in the user timezone.
      responses:
        "200":
          description: Calendar month grid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarMonth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/calendar:
    get:
      tags: [Calendar]
      summary: Get or create the ICS feed token and URL
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Calendar token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarInfo"

  /api/v2/calendar/regenerate:
    post:
      tags: [Calendar]
      summary: Rotate the ICS feed token
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: New calendar token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarInfo"

  /api/v2/calendar/sync:
    post:
      tags: [Calendar]
      summary: Import due dates from an ICS export back into tasks
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ics_file]
              properties:
                ics_file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer

  /api/v2/export:
    get:
      tags: [Export]
      summary: Export tasks as JSON or CSV
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Export payload
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
            text/csv:
              schema:
                type: string

  /api/v2/import/preview:
    post:
      tags: [Import]
      summary: Upload a CSV and preview import counts
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Staged import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/import/confirm:
    post:
      tags: [Import]
      summary: Confirm the staged CSV import
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/import/cancel:
    post:
      tags: [Import]
      summary: Discard the staged CSV import
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Staging cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v2/images:
    post:
      tags: [Images]
      summary: Upload an image
      description: |
        Stores an image using the admin-configured backend (`s3` or `local`).
        S3-compatible endpoints cover AWS S3, Cloudflare R2, DigitalOcean Spaces, and MinIO.
        Local uploads are served from `/uploads/{key}`.
        Disabled when `image_hosting_provider` is unset.
        Allowed types: JPEG, PNG, GIF, WebP. Size is capped by `image_max_bytes`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUpload"
        "400":
          description: Not configured, missing file, or unsupported type
        "413":
          description: File exceeds image_max_bytes
        "502":
          description: Storage backend failed; message is generic for end users

  /api/v2/admin/image-hosting/test:
    post:
      tags: [Admin]
      summary: Test image hosting configuration
      description: |
        Uploads a tiny probe image using the submitted settings (falling back to
        the saved secret key when omitted), then deletes it. The JSON `message`
        is safe for site admins and does not include provider XML or secrets.
        End-user uploads never receive this diagnostic.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Probe finished (ok true or false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageHostingTestResult"
        "400":
          description: Provider unset or settings invalid

  /api/v2/admin/sso:
    get:
      tags: [Admin]
      summary: Get single sign-on settings
      description: Admins only. The client secret is never returned.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: SSO settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSSOSettings"
    patch:
      tags: [Admin]
      summary: Update single sign-on settings
      description: |
        Admins only. Omitted fields stay as they are. `client_secret` is write-only
        ("" clears it). Turning `enabled` on needs an issuer URL, client ID, and
        client secret. `sso_only` turns off password sign-in and self-registration
        for everyone except admins (`403 sso_required`).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSSOPatch"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSSOSettings"
        "400":
          description: Validation error

  /api/v2/admin/security-policy:
    get:
      tags: [Admin]
      summary: Get the sign-in policy
      description: Admins only.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSecurityPolicy"
    patch:
      tags: [Admin]
      summary: Update the sign-in policy
      description: |
        Admins only. Omitted fields stay as they are.

        - `require_mfa` (`off`, `all`, `roles` with `mfa_role_ids`): browser
          sessions of people who must use two-factor authentication but haven't
          set it up get `403 mfa_enrollment_required` everywhere except `GET /me`
          and `/me/mfa*`, and turning MFA off returns `403 mfa_required_by_policy`.
          Single sign-on sessions and API keys are exempt.
        - `min_password_length` (8–64) applies to new and changed passwords.
        - `session_idle_minutes` (0 or 5–43200) and `session_max_hours` (0–2160)
          sign browser sessions out; they can't extend the default lifetime.
        - `allowed_email_domains` limits new accounts (sign-up, invites, people
          managers, single sign-on).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSecurityPolicyPatch"
      responses:
        "200":
          description: Saved policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSecurityPolicy"
        "400":
          description: Validation error

  /api/v2/admin/sso/test:
    post:
      tags: [Admin]
      summary: Check the saved issuer URL
      description: Admins only. Fetches the provider's discovery document.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Provider found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  authorization_endpoint:
                    type: string
                  token_endpoint:
                    type: string
        "400":
          description: No issuer URL saved
        "502":
          description: Discovery failed

  /api/v2/announcements/dismiss:
    post:
      tags: [Announcements]
      summary: Dismiss the global announcement banner for this session
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v2/invites:
    get:
      tags: [Invites]
      summary: List invites
      description: Not available on a company site (404); accounts there come from people managers.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      tags: [Invites]
      summary: Create an invite
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                expires_at:
                  type: string
                  format: date-time
                bypass_expiration:
                  type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /api/v2/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [Invites]
      summary: Delete an unused invite
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted

  /api/v2/admin/settings:
    get:
      tags: [Admin]
      summary: Get site settings
      description: Needs admin, or `settings:manage` on a company site.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    patch:
      tags: [Admin]
      summary: Update site settings
      description: |
        Needs admin, or `settings:manage` on a company site. `site_mode` and
        `members_can_create_*`, `members_can_use_local_agents`, and
        `members_can_add_project_agents` stay with admins (403 otherwise).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/projects/{id}/access:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Who a company-mode project is shared with
      description: |
        Company mode only. Projects are shared with teams and people. A `full` share gives
        the site role in `role_id` on this project, or each person's own site role when
        `role_id` is absent; `view` lets them open the project without changing it. Someone
        reached twice gets the role with the most project permissions (view only ranks
        lowest). The creator gets their own role, site admins always have full access, and
        holders of `projects:view_all` can at least view. `teams` and `roles` list the
        teams and roles the caller can share with, and are empty unless `can_manage`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: Share a company-mode project, or change a share
      description: |
        Needs Manage project on the project (site admins have it everywhere). Send
        `team_id` or `username`. `role_id` picks the site role a full share gives; omit it
        for each person's own role. Roles that grant admin can't be given on a share.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id: { type: integer }
                username: { type: string }
                level: { type: string, enum: [full, view], default: full }
                role_id: { type: integer, description: Site role for a full share; omit for each person's own. }
      responses:
        "200":
          description: Updated shares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/projects/{id}/access/{shareId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: shareId
        in: path
        required: true
        schema: { type: integer }
    delete:
      tags: [Projects]
      summary: Stop sharing a company-mode project with a team or person
      description: People reached only through this share lose access.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Share removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/company-home:
    get:
      tags: [Auth]
      summary: Company home page content
      description: |
        Company mode only (404 otherwise). Markdown that signed-in people see when no
        project is shared with them yet; set as `company_home` in site settings.
        `can_edit` is true for admins and `settings:manage` holders.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  can_edit: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/people:
    get:
      tags: [Admin]
      summary: List the accounts the caller can manage
      description: |
        Admins and site roles with `users:manage` see every account. In company mode,
        team roles with `team:people` see their teams' members, and `people:profile`
        holders see everyone (to set names) without managing accounts. `can_manage` says
        whether the caller may deactivate or reactivate each one: admins and
        `users:manage` holders can't be changed except by an admin, and team managers
        can't change their team's owner or other managers. `can_edit_name` says whether
        the caller may set the person's name (company mode). Returns 403 for everyone else.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: People plus the teams and roles the caller may give a new account
          content:
            application/json:
              schema:
                type: object
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        email: { type: string }
                        user_name: { type: string }
                        full_name: { type: string, description: '"First Last", empty when no name is set' }
                        first_name: { type: string }
                        last_name: { type: string }
                        active: { type: boolean }
                        role_id: { type: integer }
                        role_name: { type: string }
                        can_manage: { type: boolean }
                        can_edit_name: { type: boolean }
                        is_guest: { type: boolean, description: Company-mode guest account }
                        teams:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              role: { type: string }
                              role_name: { type: string }
                  manages_everyone: { type: boolean }
                  can_create: { type: boolean, description: False for those who only edit names }
                  names_required: { type: boolean, description: True in company mode; new accounts need first_name and last_name }
                  can_manage_guests: { type: boolean, description: "Company mode, site admins: may make accounts guests or members" }
                  guests_enabled: { type: boolean, description: The guest policy allows new guests }
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        roles:
                          type: array
                          items:
                            type: object
                            properties:
                              slug: { type: string }
                              name: { type: string }
                  site_roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        label: { type: string, description: Name to show; see SiteRole.label }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: Create an account and send it a set-password link
      description: |
        The account has no usable password. A set-password link valid for 7 days is
        emailed to it; when email isn't configured the link is returned as
        `set_password_url` for the caller to pass on. Team managers must choose one of
        their teams and a team role without `team:people` or `project:manage`, and can't
        choose a site role. Only admins can create admins or `users:manage` holders.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, user_name]
              properties:
                email: { type: string, format: email }
                user_name: { type: string }
                first_name: { type: string, description: Required in company mode }
                last_name: { type: string, description: Required in company mode }
                team_id: { type: integer, description: "Company-mode team to join; omit for no team (admins and users:manage only)." }
                site_role_id: { type: integer, description: Omit for the default User role. }
                guest: { type: boolean, description: "Create a guest account (company mode, site admins, guests enabled). The role must hold no site permission but Create projects." }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  user_id: { type: integer }
                  email_sent: { type: boolean }
                  set_password_url: { type: string }
                  warning: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/people/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Admin]
      summary: Set a person's first and last name
      description: |
        Company mode only. Names are managed like a company directory: people can't set
        their own unless they hold `people:profile` (admins do). Otherwise the caller needs
        the person within their people reach (`people:profile` reaches everyone but admins,
        whose names stay with the site owner). Both names are required.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name]
              properties:
                first_name: { type: string, maxLength: 100 }
                last_name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  first_name: { type: string }
                  last_name: { type: string }
                  full_name: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/people/{id}/guest:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Make an account a guest, or a guest a member
      description: |
        Company mode, site admins only. A guest leaves the Company team, so shares with the whole
        company stop reaching them. What else they reach follows the guest policy. Making a member
        again rejoins the company. Making a guest needs guests enabled, and refuses the site
        owner, yourself, agents, and accounts whose site role holds site permissions other than
        Create projects.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest]
              properties:
                guest: { type: boolean }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  guest: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/admin/guest-policy:
    get:
      tags: [Admin]
      summary: Guest policy
      description: Company mode, site admins only. Also returns how many guest accounts exist.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPolicy"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Admin]
      summary: Set the guest policy
      description: |
        Decides what guest accounts reach. Shares with the whole company never reach guests.
        - `enabled`: new guests can be made.
        - `access_level`: `view` makes every project shared with a guest read only. `full` gives
          the weaker of the share's role and `role_id`, which must hold no site permission but
          Create projects.
        - `via_teams`: shares with a team a guest is on reach them. Otherwise only personal
          shares do.
        - `directory`: guests can look up anyone's username. Otherwise only people on their
          projects.

        Whatever their site role says, guests hold no site permission but Create projects.
        Saving recomputes every project's access at once.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPolicy"
      responses:
        "200":
          description: Saved policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/people/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Deactivate an account
      description: |
        The person is signed out on their next request and can't sign in or use API
        keys. Their work and memberships are kept. Same reach rules as GET /api/v2/people;
        nobody can deactivate themselves or the last active admin.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Deactivated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/people/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Reactivate an account
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Reactivated
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/people/{id}/offboarding:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Admin]
      summary: What an account still holds
      description: Counts used before offboarding. Same reach rules as deactivate.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimed_tasks:
                    type: integer
                  owned_projects:
                    type: integer
                    description: Owner memberships (multi mode) or projects they created (company mode).
                  personal_keys:
                    type: integer
                  project_keys:
                    type: integer
                  agents_created:
                    type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/people/{id}/offboard:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Deactivate an account and hand off its work
      description: |
        Deactivates like `/deactivate`, then optionally:
        `transfer_projects` makes `successor_id` an owner (multi mode) or gives them a
        full share (company mode) on every project the account owns; `claims`
        `release` clears its claims on open tasks and `reassign` moves them to the
        successor where they can claim (released elsewhere); `revoke_keys` revokes
        every personal and project API key it made. Validation runs before anything changes.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                successor_id:
                  type: integer
                claims:
                  type: string
                  enum: [keep, release, reassign]
                transfer_projects:
                  type: boolean
                revoke_keys:
                  type: boolean
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  claims_reassigned:
                    type: integer
                  claims_released:
                    type: integer
                  projects_transferred:
                    type: integer
                  keys_revoked:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/admin/maintenance:
    get:
      tags: [Admin]
      summary: Get maintenance mode
      description: Admins only.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Maintenance"
    put:
      tags: [Admin]
      summary: Turn maintenance (read-only) mode on or off
      description: |
        Admins only. While it's on, every POST, PUT, PATCH, and DELETE from anyone
        but an admin returns `503 maintenance` with `Retry-After`, except signing in
        and out. Reads keep working, and `GET /site` reports `maintenance` so clients
        can show a banner. Background jobs keep running.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                message:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Maintenance"

  /api/v2/admin/backups:
    get:
      tags: [Admin]
      summary: Backup status
      description: Admins only. Whether pg_dump is available, the schedule from the environment, and stored backups.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  pg_dump_available:
                    type: boolean
                  pg_dump_version:
                    type: string
                  scheduled:
                    type: boolean
                  schedule:
                    type: object
                    properties:
                      dir:
                        type: string
                      interval_hours:
                        type: integer
                      keep:
                        type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        size:
                          type: integer
                        created_at:
                          type: string
                          format: date-time

  /api/v2/admin/backups/download:
    get:
      tags: [Admin]
      summary: Download a fresh backup
      description: |
        Admins only. Streams a .tar.gz with `database.dump` (pg_dump custom format),
        `uploads/` (when images are stored on this server), and `manifest.json` with
        restore steps. Needs pg_dump on the server (PATH or `PG_DUMP_PATH`).
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "503":
          description: pg_dump isn't installed

  /api/v2/admin/backups/files/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Admin]
      summary: Download a stored (scheduled) backup
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Archive
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/admin/audit-stream:
    get:
      tags: [Admin]
      summary: Get audit streaming settings
      description: Admins only. Secrets are never returned.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStream"
    put:
      tags: [Admin]
      summary: Configure audit streaming
      description: |
        Admins only. While enabled, new admin events (plus project and task events
        when included) are POSTed to `url` about every 15 seconds as
        `{"site": "...", "events": [{source, id, occurred_at, actor_user_id, actor,
        event_type, target_type, target_id, target, metadata}]}`, in order, up to 200
        per batch. With a `secret`, requests carry `X-Ordryn-Timestamp` and
        `X-Ordryn-Signature: sha256=HMAC(secret, timestamp + "." + body)`;
        `auth_header` is sent as `Authorization`. A batch is retried until the
        endpoint answers 2xx. Turning it on starts from new events (no backfill);
        use the audit CSV export for history. `secret` and `auth_header` are
        write-only ("" clears).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                url:
                  type: string
                secret:
                  type: string
                  writeOnly: true
                auth_header:
                  type: string
                  writeOnly: true
                include_project:
                  type: boolean
                include_task:
                  type: boolean
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStream"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/admin/audit-stream/test:
    post:
      tags: [Admin]
      summary: Send a test event to the audit stream endpoint
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Delivered
        "502":
          description: The endpoint failed

  /api/v2/admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /api/v2/admin/users/{id}/ban:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Ban a user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v2/admin/users/{id}/unban:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Unban a user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v2/admin/users/{id}/username:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Admin]
      summary: Set a user's username
      description: Clears username_change_available so the user is not stuck in the claim flow.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name]
              properties:
                user_name:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[A-Za-z0-9_]+$'
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  user_name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/admin/users/{id}/owner:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Transfer site ownership
      description: |
        The site owner is the one account above admins: only the owner can make, change,
        or deactivate admins, and nobody can change or deactivate the owner. Only the
        current owner can call this, and the new owner must be an active admin. The
        previous owner stays an admin.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Ownership transferred
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/admin/users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [Admin]
      summary: Assign a user's site role
      description: |
        Takes effect on the user's next request; no new login is needed. Admins can't change
        their own role, the site must keep at least one admin, and agent and automation
        accounts can't be reassigned. Only the site owner can give or take away the admin
        role, and the owner's own role can't change (transfer ownership first).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  role_id:
                    type: integer
                  role_name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/admin/site-roles:
    get:
      tags: [Admin]
      summary: List site roles and the site permission catalog
      description: |
        Site roles control site-wide abilities such as creating projects or organizations.
        They are separate from project and organization roles. The built-in Admin role has
        every permission and is locked; the built-in User role is the default for new accounts.
        Needs admin, or `roles:manage` on a company site. A `roles:manage` holder who isn't an
        admin can't change their own role, and only works with roles and permissions their
        own role has.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Catalog plus roles (Admin, User, then custom roles by name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRolesList"
    post:
      tags: [Admin]
      summary: Create a custom site role
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRoleWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/admin/site-roles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Admin]
      summary: Rename a site role or set its permissions
      description: |
        `permissions` replaces the role's catalog permissions; permissions outside the catalog
        are kept. The Admin role's permissions can't be edited. On a company site the
        Admin and User roles can be renamed, which sets their `label` and leaves `name`
        unchanged; elsewhere they keep their names.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRoleWrite"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Admin]
      summary: Delete a custom site role
      description: Accounts on the role move to the User role.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  users_moved:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/admin/email-audit:
    get:
      tags: [Admin]
      summary: Query outbound email audit log
      description: |
        Lists recent outbound email attempts (success, failure, not configured, and rate limited).
        Message bodies are never stored. Rows older than email_audit_retention_days are deleted automatically.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [sent, failed, not_configured, rate_limited]
        - name: trigger
          in: query
          schema:
            type: string
            enum: [password_reset, password_changed, site_invite, join_request, project_invite]
        - name: q
          in: query
          description: Case-insensitive substring match on recipient email
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive start)
          schema:
            type: string
        - name: to
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive end of day when a date)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit rows, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuditList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/admin/audit:
    get:
      tags: [Admin]
      summary: Query the unified audit log
      description: |
        One newest-first view over task events, project events, comment revisions,
        outbound email attempts, and site-admin actions (bans, username changes,
        site roles and role assignments, site settings, role templates, invites,
        join requests, extensions).
        Change events carry `metadata.from` / `metadata.to`; site settings changes
        carry `metadata.changes` keyed by field. Secret values are never recorded.
        Rows older than `audit_retention_days` (when non-zero) are deleted automatically.
        Needs admin, or `audit:view` on a company site (also for the email log and comment
        history; restoring a comment stays with admins).
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          description: Actor user id
          schema:
            type: integer
            minimum: 1
        - name: project_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: source
          in: query
          schema:
            type: string
            enum: [task, project, comment, email, admin]
        - name: event_type
          in: query
          description: Exact event type (see /api/v2/admin/audit/facets)
          schema:
            type: string
        - name: since
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive start)
          schema:
            type: string
        - name: until
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive end of day when a date)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit rows, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/admin/audit/export:
    get:
      tags: [Admin]
      summary: Export the unified audit log as CSV
      description: |
        Same filters as /api/v2/admin/audit (limit/offset ignored); returns up to 50,000 rows,
        newest first. Cells starting with = + - @ are prefixed with ' to prevent formula injection.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: project_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: source
          in: query
          schema:
            type: string
            enum: [task, project, comment, email, admin]
        - name: event_type
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/admin/audit/facets:
    get:
      tags: [Admin]
      summary: Audit log filter choices
      description: Distinct (source, event_type) pairs on record, and every project (archived included).
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Filter choices
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_types:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        event_type:
                          type: string
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        archived:
                          type: boolean

  /api/v2/admin/comment-audit:
    get:
      tags: [Admin]
      summary: Query discussion comment audit log
      description: |
        Lists previous comment bodies captured when a comment was edited, deleted, or restored.
        Site admins can restore any revision.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [edit, delete, restore]
        - name: q
          in: query
          description: Case-insensitive substring match on body, task title, project, or usernames
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit rows, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentAuditList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/admin/comment-audit/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Restore a comment to a previous version
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Restored comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/admin/project-roles:
    get:
      tags: [Admin]
      summary: List site-level project roles and the permission catalog
      description: Owner is the only site role, so the list holds just Owner.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Catalog plus site roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRolesList"
    post:
      tags: [Admin]
      summary: Create a site-level project role (retired)
      description: |
        Always refused with a `validation` error. Owner is the only site role; create other
        roles on an organization or project instead.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRoleWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/admin/project-roles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Admin]
      summary: Update a site-level project role
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRolePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete an unused non-system site role
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/admin/project-roles/reorder:
    post:
      tags: [Admin]
      summary: Reorder site-level project roles
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleReorder"
      responses:
        "200":
          description: Reordered
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/admin/extensions:
    get:
      tags: [Admin]
      summary: List loaded extensions
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Extensions with site-level enable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtensionsList"

  /api/v2/admin/extensions/reload:
