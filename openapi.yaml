  /api/v2/tasks/{id}/snooze:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [Tasks]
      summary: Snooze a task in your planner
      description: |
        Hides the task from your planner's Today sections until `until` (a day after today in your
        timezone, at most a year ahead). Snoozes are private to you and don't change the task.
        Any task you can see can be snoozed. Snoozing again replaces the day.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until:
                  type: string
                  format: date
      responses:
        "200":
          description: Snoozed
          content:
            application/json:
              schema:
                type: object
                properties:
                  snoozed_until:
                    type: string
                    format: date
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
