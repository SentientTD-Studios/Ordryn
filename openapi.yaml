            description: A task (same fields as the task list) plus created_by, created_by_name, completed_date, and nested children in tree mode.
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
        mode: { type: string }
        columns: { type: array, items: { type: string } }
        unavailable:
