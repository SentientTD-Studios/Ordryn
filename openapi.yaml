openapi: 3.0.3
info:
  title: Ordryn / GoTodo API
  description: |
    JSON API for Ordryn (GoTodo). Self-host with `ORDRYN_MODE=full` (UI + API) or
    `ORDRYN_MODE=api` (API only). Redis is required for `/api/v2` authentication,
    rate limiting, and live SSE fan-out.

    Auth: session cookie (SPA login/register) or `Authorization: Bearer <api_key>`.

    Project API keys (`/api/v2/projects/{id}/api-keys`) are limited to one project
    and act as the manager who created them. They carry scopes:
    `tasks:read` (list/get tasks and comments; read the project, statuses,
    sprints, custom fields), `tasks:write` (create/update tasks) and
    `comments:write` (post comments). Any other endpoint returns 403. Tasks
    outside the project return 404, and `GET /tasks` is always filtered to the
    key's project. Keys stop working when they expire, are revoked, or their
    creator loses project:manage.

    AI agents (`/api/v2/projects/{id}/agents`) are project members backed by a
    bot account. Managers mint keys that act as the agent; agent keys get the
    project-key allowlist plus the agent's own guardrails (editable fields,
    allowed columns, completion, task creation, comments), the agent queue under
    `/api/v2/agent`, and an MCP endpoint at `/api/v2/mcp`. Edits outside the
    guardrails return 403 `agent_guardrail`.

    Local agent keys (`POST /api/v2/api-keys` with `kind: "local_agent"`) are
    personal keys for an AI agent on your own machine (Claude Code, Codex,
    Gemini CLI, Cursor, a script). They act as you, carry the same scopes as
    project keys (`tasks:read` is required), and may be limited to one project
    with `project_id`. They reach only `/mcp`, `GET /me`, tasks (list, get,
    create, update, claim), task comments (list, post), `GET /projects` (when
    not limited), a project's details, statuses, sprints and custom fields, and
    `GET /tags`. Everything else returns 403, including key management and
    account settings. When limited, tasks in other projects return 404 and
    lists are filtered to the project.

    Rate limits (per user, Redis token bucket). Reads and writes are independent.
    Bearer API keys: 120 GET/min (~2/sec) and 60 writes/min (~1/sec).
    SPA session cookies use a higher budget (600 GET/min, 240 writes/min) so the
    web UI is not gated by the external API ceiling.

    Canonical paths are `/api/v2`. `/api/v1` remains as a compatibility alias
    for existing webhooks, OAuth callbacks, and clients.
  version: 2.0.0
  license:
    name: See LICENSE in repository

servers:
  - url: /
    description: Same-origin (BASE_PATH may prefix these paths)

tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: API Keys
  - name: Tasks
  - name: Notifications
  - name: Projects
  - name: AI Agents
  - name: Automation
  - name: Organizations
  - name: Tags
  - name: Saved Views
  - name: Queries
  - name: Device Auth
  - name: GitHub
  - name: Live
  - name: Feedback
  - name: Images

paths:
  /api/v2/health:
    get:
      tags: [Health]
      summary: Public health probe
      security: []
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v2/site:
    get:
      tags: [Health]
      summary: Public site metadata for the SPA shell
      security: []
      responses:
        "200":
          description: Site metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteInfo"

  /api/v2/events:
    get:
      tags: [Live]
      summary: Live task and project updates (Server-Sent Events)
      description: |
        Long-lived `text/event-stream` for the authenticated user. The SPA uses a
        session cookie (`EventSource` cannot send `Authorization` headers).

        Named events:
        - `ready` — stream is open
        - `ping` — keepalive about every 25s
        - `task-update` — JSON invalidation payload (`type`, optional `task_id` /
          `project_id`, `actor_id`, `timestamp`). Clients should refetch the
          current view; the payload does not include task bodies.

        Types include `task.created`, `task.updated`, `task.deleted`,
        `task.reordered`, `project.updated`, and `join.request`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: ready
                  data: {}

                  event: task-update
                  data: {"type":"task.updated","task_id":42,"project_id":7,"actor_id":3}
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/auth/register:
    post:
      tags: [Auth]
      summary: Register an account
      description: |
        With an invite token, or on a site without outbound email, the account is
        created and signed in (201).

        Open sign-up on a site with email answers 202 for every address: a new
        address gets an unconfirmed account and a confirmation link; an address
        that already has an account gets an email telling its owner. Signing up
        again with an address that is still unconfirmed replaces its password,
        username and timezone and sends a new link. The account is activated by
        using the link together with the password (`POST /api/v2/auth/verify-email`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created; Set-Cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "202":
          description: Confirmation email sent (or, for an existing address, a notice to its owner)
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_required:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: First-time setup hasn't been completed (`setup_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/setup:
    get:
      tags: [Auth]
      summary: Whether first-time setup is still required
      security: []
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setup_required:
                    type: boolean
                    description: True until setup creates the first account.
    post:
      tags: [Auth]
      summary: Complete first-time setup and start a session
      description: |
        Creates the first account with the admin role, applies the initial site
        settings and site mode, and signs the admin in. Only works while the site
        has no accounts. `setup_token` is printed to the server log at startup while
        setup is required; it changes on every restart until setup is finished.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setup_token, email, user_name, password, confirm_password, timezone, site_mode]
              properties:
                setup_token:
                  type: string
                  description: Token from the server log. Dashes, spaces, and case are ignored.
                email:
                  type: string
                  format: email
                user_name:
                  type: string
                password:
                  type: string
                  minLength: 8
                confirm_password:
                  type: string
                timezone:
                  type: string
                  description: IANA timezone for the admin; also becomes the site default.
                site_name:
                  type: string
                  description: Leave empty to keep the default name.
                site_mode:
                  type: string
                  enum: [multi, company]
                  description: Can still change in Admin until the first project or organization exists.
                registration:
                  type: string
                  enum: [invite, open, closed]
                  default: invite
                  description: invite requires an invite token to sign up; open lets anyone sign up; closed turns signup off.
                enable_api:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Admin created; Set-Cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Wrong setup token (`invalid_setup_token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The site already has an account (`setup_complete`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/join-requests:
    post:
      tags: [Auth]
      summary: Submit a request to join the site
      description: Not available on a company site (404); accounts there come from people managers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                message:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Acknowledgement (same message even if already pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/auth/login:
    post:
      tags: [Auth]
      summary: Login and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated with a session cookie, or MFA challenge (pending cookie only)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/MFARequired"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            `email_unverified`: the password is right but the email hasn't been
            confirmed yet. `banned`: the account is deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address and sign in
      description: |
        Uses up the link from the confirmation email. The password chosen at
        sign-up is required too: a link proves control of the inbox but not who
        started the sign-up, and a repeat sign-up of an unconfirmed address
        replaces its password. A wrong password leaves the link usable.

        On success the account is signed in (session cookie, `User` body), unless
        it needs a second factor or was deactivated; then the body is `{"ok": true}`
        and the person signs in normally.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, token, password]
              properties:
                id:
                  type: string
                  format: uuid
                token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Email confirmed; signed in (`User`) or confirmed only (`OK`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/User"
                  - $ref: "#/components/schemas/OK"
        "400":
          description: "`invalid_link`: unknown, used or expired; `invalid_request`: missing fields"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "`invalid_credentials`: the password isn't the account's; the link still works"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v2/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new confirmation link
      description: >-
        Always answers 200. If the address has an unconfirmed account, a new link
        is emailed and earlier links stop working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/auth/passkey/begin:
    post:
      tags: [Auth]
      summary: Start signing in with a passkey
      description: |
        No email needed: the authenticator offers the passkeys it holds for this site. Returns
        `options` for `navigator.credentials.get()` and a `token` (valid 5 minutes, usable once).
      responses:
        "200":
          description: Ceremony started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"

  /api/v2/auth/passkey/finish:
    post:
      tags: [Auth]
      summary: Finish signing in with a passkey
      description: |
        Verifies the assertion and starts a session. A passkey needs the device's PIN or
        biometric, so it counts as two-factor: there is no separate MFA step, and the security
        policy's two-factor requirement is met for this session. The same account checks as
        password sign-in apply (deactivated, single-sign-on-only, unconfirmed email). Any
        verification failure returns the same 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              properties:
                token: { type: string }
                credential:
                  type: object
                  description: The assertion response, with binary fields base64url-encoded.
      responses:
        "200":
          description: Signed in; the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete MFA login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: Authenticated; Set-Cookie session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out this session
      description: >-
        Clears the session cookie and revokes this sign-in on the server, so a copy
        of the cookie stops working too. Other sessions stay signed in.
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v2/auth/username-available:
    get:
      tags: [Auth]
      summary: Check whether a username is available
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  available:
                    type: boolean
                  valid:
                    type: boolean
                  message:
                    type: string

  /api/v2/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, confirm_email]
              properties:
                email:
                  type: string
                  format: email
                confirm_email:
                  type: string
                  format: email
      responses:
        "200":
          description: Request accepted (always returns ok when valid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/auth/reset-password:
    get:
      tags: [Auth]
      summary: Validate a password reset token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  email:
                    type: string
                    format: email
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Auth]
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, token, new_password, confirm_password]
              properties:
                id:
                  type: string
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                confirm_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/auth/device/code:
    post:
      tags: [Device Auth]
      summary: Start device authorization (Android SSO)
      description: |
        Optional `redirect_uri` binds a native deep link (allowlisted `ordryn://auth-complete`)
        to this authorization. After the user approves or denies in the browser, the SPA
        navigates to that URI so the Android app can resume.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uri:
                  type: string
                  description: Optional native deep link; must be ordryn://auth-complete
                  example: ordryn://auth-complete
      responses:
        "200":
          description: Device codes issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/auth/device/token:
    post:
      tags: [Device Auth]
      summary: Poll device authorization for API key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, grant_type]
              properties:
                device_code:
                  type: string
                grant_type:
                  type: string
                  description: Must be urn:ietf:params:oauth:grant-type:device_code
      responses:
        "200":
          description: Approved; returns api_key once
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                  key_prefix:
                    type: string
                  key_name:
                    type: string
        "400":
          description: Pending, denied, expired, or invalid (OAuth-style error body)

  /api/v2/auth/device/status:
    get:
      tags: [Device Auth]
      summary: Look up a pending device authorization by user_code
      security: []
      parameters:
        - name: user_code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/auth/device/approve:
    post:
      tags: [Device Auth]
      summary: Approve a pending device authorization
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
      responses:
        "200":
          description: Approved; includes redirect_uri when the device requested one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDecisionResponse"

  /api/v2/auth/device/deny:
    post:
      tags: [Device Auth]
      summary: Deny a pending device authorization
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
      responses:
        "200":
          description: Denied; includes redirect_uri when the device requested one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDecisionResponse"

  /api/v2/me:
    get:
      tags: [Profile]
      summary: Current user profile
      description: |
        Unauthenticated session probes return HTTP 200 with a JSON `null` body
        (not 401), so SPA bootstrap works behind proxies that rewrite 401 to HTML.
        Invalid Bearer tokens still return 401.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Profile, or null when no session
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      summary: Update profile fields
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/username:
    post:
      tags: [Profile]
      summary: One-time username claim for migrated accounts
      description: |
        Allowed only when `username_change_available` is true. Sets the username
        and clears the free-change flag. New registrations do not get this flag.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name]
              properties:
                user_name:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[A-Za-z0-9_]+$'
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/me/passkeys:
    get:
      tags: [Profile]
      summary: List your passkeys
      description: Browser sessions only; API keys get 403.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Passkeys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passkey"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/me/passkeys/register/begin:
    post:
      tags: [Profile]
      summary: Start adding a passkey
      description: |
        Needs your current password, unless this session signed in through single sign-on (those
        accounts may have no password). Returns `options` to pass to
        `navigator.credentials.create()` (base64url fields) and a `token` for the finish call,
        valid for 5 minutes. Passkeys are discoverable credentials with user verification
        required. The relying party ID is the host of `PUBLIC_URL` (or of the request when it's
        unset). At most 20 passkeys per account. Allowed while the security policy is waiting for
        you to set up two-factor authentication.
      security:
        - SessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
      responses:
        "200":
          description: Ceremony started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/me/passkeys/register/finish:
    post:
      tags: [Profile]
      summary: Finish adding a passkey
      description: Send the `token` and the authenticator's response (`PublicKeyCredential` as JSON). Each token works once.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, credential]
              properties:
                token: { type: string }
                name:
                  type: string
                  maxLength: 60
                  description: Label such as "Work laptop"; defaults to "Passkey".
                credential:
                  type: object
                  description: The registration response, with binary fields base64url-encoded.
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/me/passkeys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Profile]
      summary: Rename a passkey
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "204":
          description: Renamed
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Profile]
      summary: Remove a passkey
      description: It can no longer be used to sign in. (Also remove it from your device or password manager.)
      security:
        - SessionCookie: []
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/me/avatar:
    post:
      tags: [Profile]
      summary: Upload profile picture
      description: |
        Uploads and updates the user's profile picture. Image hosting must be
        configured. Accepts PNG and JPEG images only, bounded by the site's upload limit.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Updated profile with new avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Image exceeds maximum allowed size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Profile]
      summary: Remove profile picture
      description: Clears the user's avatar URL.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Updated profile with cleared avatar URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/notification-preferences:
    get:
      tags: [Profile]
      summary: List notification preferences
      description: |
        Returns the optional notification types visible to the caller, whether each is
        enabled in-app and by email, and the caller's email delivery and due-date reminder
        settings. Security emails (password reset, password changed) and invites are always
        sent and are not listed. Admin-only types appear only for admins.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Profile]
      summary: Update notification preferences
      description: |
        Updates in-app and email notification settings. Every field is optional; omitted
        fields and types are unchanged. All changes are validated before any is applied.
        Turning email on (email_mode from off) only affects notifications created afterwards.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preferences:
                  type: object
                  description: Map of notification type to enabled in-app.
                  additionalProperties:
                    type: boolean
                  example:
                    task_created: false
                email_types:
                  type: object
                  description: |
                    Map of notification type to emailed. Only types with email_available
                    are accepted. A type is emailed only while it is also enabled in-app.
                  additionalProperties:
                    type: boolean
                  example:
                    task_mentioned: true
                    due_reminder: true
                email_mode:
                  type: string
                  enum: [off, instant, digest]
                digest_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: Local hour (in the user's timezone) the daily digest goes out.
                reminder_timing:
                  type: string
                  enum: [off, day_before, morning, both]
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/password:
    post:
      tags: [Profile]
      summary: Change password
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: >-
            Password changed. Every other session of the account is signed out;
            the session that made the change stays signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/sign-out-others:
    post:
      tags: [Profile]
      summary: Sign out other devices
      description: >-
        Signs out every session of the account except the one making the request.
        Called with an API key, it signs out all browser sessions. API keys are not affected.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Other sessions signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/mfa:
    get:
      tags: [Profile]
      summary: MFA status
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Whether MFA is enabled and unused recovery codes remaining
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/mfa/setup:
    post:
      tags: [Profile]
      summary: Start MFA enrollment
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: TOTP secret and otpauth URL (secret stashed on the session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/me/mfa/enable:
    post:
      tags: [Profile]
      summary: Confirm TOTP and enable MFA
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: MFA enabled; recovery codes shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/me/mfa/disable:
    post:
      tags: [Profile]
      summary: Disable MFA
      description: Requires a current TOTP code or an unused recovery code.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: MFA disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/me/mfa/recovery-codes:
    post:
      tags: [Profile]
      summary: Replace recovery codes
      description: Requires a current TOTP code or an unused recovery code. New codes are shown once.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFACodeRequest"
      responses:
        "200":
          description: New recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v2/users/search:
    get:
      tags: [Projects]
      summary: Search usernames for project invites or discussion mentions
      description: |
        Case-insensitive username prefix match. Empty `q` or queries shorter than
        2 characters return `[]`. Does not return emails. Rate limited more tightly
        than other read endpoints.

        Without `project_id`, this is the invite picker: it excludes the current
        user, banned users, and users who opted out of project invites.

        With `project_id`, results are limited to members of that project (including
        the current user). The caller must be able to access the project. Invite
        opt-out does not apply; banned members are still excluded.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          required: false
          description: When set, only matching members of this project are returned.
          schema:
            type: integer
            minimum: 1
        - name: include_teams
          in: query
          required: false
          description: |
            With `project_id`, set to `1` to also return up to 5 team handles
            (`is_team: true`) after the username hits. A team's handle is its name
            lowercased with other characters turned into underscores
            ("Design Team" -> `design_team`). Mentioning it notifies the team's
            members who are on the project; a username with the same handle wins.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Matching usernames
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [GitHub]
      summary: GitHub connection status for the current user
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [GitHub]
      summary: Disconnect GitHub
      description: |
        Without `owner`, removes every stored GitHub token. With `owner=<name>`, removes only the
        token used for that user/organization; `owner=` (empty) removes the catch-all token.
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/github/pat:
    post:
      tags: [GitHub]
      summary: Connect GitHub with a personal access token
      description: |
        Adds or replaces a token. Tokens are stored per owner: a token with an `owner` is used for
        repositories of that user/organization, and a token without one is the catch-all for every
        other owner. Fine-grained tokens are bound to one resource owner by GitHub, so when `owner`
        is omitted they are stored for the token's own login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                owner:
                  type: string
                  description: GitHub user or organization this token is for (optional).
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"

  /api/v2/me/github/oauth/start:
    get:
      tags: [GitHub]
      summary: Start GitHub OAuth (requires admin-configured OAuth App)
      responses:
        "200":
          description: Authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorize_url:
                    type: string
                  redirect_uri:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/APIError"

  /api/v2/me/extensions:
    get:
      tags: [Extensions]
      summary: List personal-inbox hook destinations
      description: Only site-enabled extensions that declare user-scoped settings (scope user or member) are returned.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Personal destinations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExtensionsList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/extensions/{extensionId}:
    parameters:
      - name: extensionId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Extensions]
      summary: Get a personal-inbox destination
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Personal destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExtension"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Extensions]
      summary: Update a personal-inbox destination
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectExtensionPatch"
      responses:
        "200":
          description: Updated destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExtension"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/me/extensions/{extensionId}/test:
    parameters:
      - name: extensionId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Extensions]
      summary: Send a test event to a personal-inbox destination
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Test sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  sample_json:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/me/extensions/{extensionId}/deliveries/{deliveryId}/retry:
    parameters:
      - name: extensionId
        in: path
        required: true
        schema:
          type: string
      - name: deliveryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Extensions]
      summary: Retry a failed or dead personal-inbox delivery
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/auth/github/callback:
    get:
      tags: [GitHub]
      summary: GitHub OAuth callback (public redirect)
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Redirects to Settings

  /api/v2/auth/sso/start:
    get:
      tags: [Auth]
      summary: Start single sign-on (browser redirect)
      description: |
        Redirects to the configured OpenID Connect provider (authorization code
        flow with PKCE, a nonce, and a state bound to this browser by a short-lived
        cookie). Errors redirect to `/login?sso_error=…`.
      security: []
      parameters:
        - name: return
          in: query
          description: Path on this site to land on after signing in. Anything else becomes `/`.
          schema:
            type: string
      responses:
        "302":
          description: Redirects to the identity provider
        "303":
          description: SSO is off or unreachable; redirects to the login page with `sso_error`

  /api/v2/auth/sso/callback:
    get:
      tags: [Auth]
      summary: Single sign-on callback (public redirect)
      description: |
        Verifies the ID token, then signs in the account linked to the provider's
        subject, or the account with the same verified email (linking it), or a new
        account when automatic creation is on and the email domain is allowed. In
        company mode, mapped provider groups set team membership. Local TOTP is not
        asked for: the provider handles the second factor.
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Signed in and redirected to the `return` path, or back to `/login?sso_error=…`

  /api/v2/webhooks/github:
    post:
      tags: [GitHub]
      summary: GitHub issues webhook (updates linked tasks only; never creates tasks)
      security: []
      parameters:
        - name: X-Ordryn-Webhook-Secret
          in: header
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"

  /api/v2/webhooks/inbound:
    post:
      tags: [Webhooks]
      summary: Generic inbound webhook (create, comment, complete, or set_field)
      description: Public HMAC or shared-secret receiver. Returns 403 until an admin enables inbound webhooks. complete and set_field require an enabled extension on the project that declares those actions. project_id is required. HMAC must include X-Ordryn-Timestamp (unix seconds, ±5 minutes); the signature is HMAC-SHA256 of timestamp + "." + raw body.
      security: []
      parameters:
        - name: X-Ordryn-Webhook-Secret
          in: header
          schema:
            type: string
        - name: X-Ordryn-Signature
          in: header
          description: HMAC SHA-256 of timestamp + "." + raw body, prefixed with sha256=
          schema:
            type: string
        - name: X-Ordryn-Timestamp
          in: header
          description: Unix seconds. Required for HMAC. Rejected if skewed more than 5 minutes.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, project_id]
              properties:
                action:
                  type: string
                  enum: [create, comment, complete, set_field]
                title:
                  type: string
                description:
                  type: string
                task_id:
                  type: integer
                comment:
                  type: string
                field:
                  type: string
                  description: Custom field key for set_field (extension_id.local_key).
                value:
                  type: string
                project_id:
                  type: integer
                  description: Required. Identifies the inbound project.
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"

  /api/v2/ext/callback:
    post:
      tags: [Webhooks]
      summary: Extension callback (scoped token)
      description: Bearer token from an outbound JSON webhook. Permissions come from the extension manifest, not from a user API key. The iframe UI never receives this token.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: Bearer odycb_…
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [get, complete, comment, set_field]
                task_id:
                  type: integer
                comment:
                  type: string
                field:
                  type: string
                value:
                  type: string
      responses:
        "200":
          description: Action result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/extensions/{id}/icon:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Extension icon
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Image bytes
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/api-keys:
    get:
      tags: [API Keys]
      summary: List active API keys (no plaintext)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
    post:
      tags: [API Keys]
      summary: Create or rotate a named API key
      description: |
        Creates a personal key. An existing key with the same name is revoked.
        `kind: "standard"` (the default) acts with your full access.
        `kind: "local_agent"` makes a key for an AI agent on your machine: it
        acts as you but only through the task allowlist, within `scopes`
        (default `["tasks:read"]`; `tasks:read` is required) and, if
        `project_id` is set, one project you belong to. Local agent keys and
        project keys cannot create keys.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
                kind:
                  type: string
                  enum: [standard, local_agent]
                  default: standard
                scopes:
                  type: array
                  description: local_agent only
                  items:
                    type: string
                    enum: ["tasks:read", "tasks:write", "comments:write"]
                project_id:
                  type: integer
                  nullable: true
                  description: local_agent only; limits the key to this project
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: local_agent only; at most 5 years out
      responses:
        "201":
          description: Key created; plaintext shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/APIError"

  /api/v2/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [API Keys]
      summary: Rename an API key
      description: Changes only the display name. The secret token is unchanged. Names are unique among the user's active keys (case-insensitive).
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: Updated key metadata (no plaintext)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [API Keys]
      summary: Revoke an API key
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
        - name: project
          in: query
          schema:
            type: string
          description: Project id, or none/0 for no project
        - name: tag
          in: query
          schema:
            type: string
          description: >
            Tag id when filtering a specific project, or a tag name (or id resolved to name)
            when listing all tasks / inbox. Up to 10 comma-separated values match tasks with any of them.
        - name: due
          in: query
          schema:
            type: string
            enum: [overdue, today, week, through_week, none, range]
          description: Due-date preset. `range` is a marker for clients; the range itself comes from due_from / due_to.
        - name: due_from
          in: query
          schema:
            type: string
            format: date
          description: Only tasks due on or after this date (inclusive). Tasks with no due date never match.
        - name: due_to
          in: query
          schema:
            type: string
            format: date
          description: Only tasks due on or before this date (inclusive).
        - name: priority
          in: query
          schema:
            type: string
          description: Priority 0-3, or a comma-separated set (e.g. `2,3`) to match any of them.
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: completed
          in: query
          schema:
            type: string
        - name: workflow_claim_scope
          in: query
          schema:
            type: string
            enum: [mine, all]
          description: >
            When mine, hide unclaimed kanban-project tasks (classic tasks unchanged).
            Use all for the kanban board backlog. Default is no claim filter when omitted.
        - name: claimed
          in: query
          schema:
            type: string
            enum: [me, none]
          description: >
            Only tasks claimed by the caller (me) or by nobody (none). Claims exist on
            kanban-project tasks only. Matching subtasks whose parent does not match are
            returned as their own rows. Omit for no claim filter.
        - name: include_subtasks
          in: query
          schema:
            type: string
            enum: ["1", "true", "yes"]
          description: >
            When set, matching subtasks are returned as their own rows instead of
            only root tasks. Used by dashboard due sections so leftover overdue
            children stay visible after a parent is completed.
        - name: sprint_id
          in: query
          schema:
            type: string
          description: >
            Filter kanban tasks by sprint id. Use none, backlog, or 0 for unassigned
            (backlog) tasks. Omitted means no sprint filter.
      responses:
        "200":
          description: Paginated task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        On a company site every task needs a project: a root task without `project_id`
        returns 400 (subtasks take their parent's), and an update can't clear `project_id`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/tasks/reorder:
    post:
      tags: [Tasks]
      summary: Reorder tasks
      description: |
        Updates manual sort order (`position`) for the listed tasks.
        Listed IDs are rearranged among the slots they already occupy, so filtered
        lists (e.g. incomplete-only) do not overwrite unrelated tasks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReorder"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReorderResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/tasks/bulk:
    post:
      tags: [Tasks]
      summary: Apply a bulk action to tasks
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskBulk"
      responses:
        "200":
          description: Action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/tasks/undo:
    post:
      tags: [Tasks]
      summary: Restore deleted tasks via undo_token (or session undo buffer)
      description: |
        Deleted tasks go to the trash; undo restores them from it with comments, links,
        custom fields, history, and subtasks intact. The token expires after expires_in
        seconds, but the tasks stay restorable from /api/v2/trash until the trash is purged.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                undo_token:
                  type: string
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  restored:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/trash:
    get:
      tags: [Tasks]
      summary: List the trash
      description: |
        Trashed tasks the caller can restore: their own personal tasks, and project tasks
        where their role has tasks:delete. A task trashed together with its parent is not
        listed on its own; it is counted in the parent's subtask_count and restored with it.
        Tasks are permanently deleted at purge_at (an admin sets the retention, default 30 days).
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Trashed tasks, most recently deleted first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrashEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Tasks]
      summary: Empty the trash
      description: Permanently deletes every task in the caller's trash listing.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Emptied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/trash/{id}:
    delete:
      tags: [Tasks]
      summary: Permanently delete a trashed task
      description: Deletes the task and its subtasks for good. Only tasks already in the trash.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/trash/{id}/restore:
    post:
      tags: [Tasks]
      summary: Restore a trashed task
      description: |
        Restores the task and the subtasks trashed with it. A subtask whose parent is still
        in the trash returns 409; restore the parent first.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  restored:
                    type: array
                    description: Ids of every task restored (the task and its subtasks).
                    items:
                      type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Get one task
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      summary: Update a task
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      summary: Move a task to the trash (returns undo_token)
      description: |
        Moves the task to the trash, where it can be restored (POST /api/v2/trash/{id}/restore)
        until the trash is purged. When the task has subtasks, pass mode=cascade (default) to
        trash them too, or mode=reparent with new_parent_id (0 or omit to promote to root) to
        move children before trashing the parent.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [cascade, reparent]
            default: cascade
        - name: new_parent_id
          in: query
          schema:
            type: integer
          description: Target root task id when mode=reparent; 0 or omit promotes children to root
      responses:
        "200":
          description: Deleted with undo token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/tasks/{id}/watch:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Caller's watch state and the task's watchers
      description: |
        Watchers get in-app notifications when the task is completed or reopened,
        changes status or due date, is claimed, becomes blocked, or becomes unblocked
        (its last open blocker is completed). Creating, commenting on, or claiming a
        project task watches it automatically. Watching a project (see
        /projects/{id}/watch) covers all of its tasks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWatch"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tasks]
      summary: Watch a task
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWatch"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      summary: Stop watching a task
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state (watching stays true when the project is watched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWatch"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/tasks/{id}/links:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Linked tasks (blocks / blocked by / relates / duplicates)
      description: Links to tasks the caller cannot see are omitted.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Links from this task's point of view
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskLink"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tasks]
      summary: Link this task to another
      description: |
        Requires tasks:edit on this task and read access to the other task.
        Blocking links that would form a cycle return 409.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskLinkCreate"
      responses:
        "201":
          description: Created link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate link or blocking cycle

  /api/v2/tasks/{id}/links/{linkId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: linkId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [Tasks]
      summary: Remove a link
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}/watch:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Whether the caller watches every task in the project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWatch"
    post:
      tags: [Projects]
      summary: Watch every task in the project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWatch"
    delete:
      tags: [Projects]
      summary: Stop watching the project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Watch state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWatch"

  /api/v2/tasks/{id}/recurrence:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Get a task's repeat rule and series history
      description: |
        Returns the active repeat rule (null when the task is not the current
        occurrence of a series), a preview of the next due date, links to the
        previous/next occurrence, and recent tasks in the same series.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Recurrence detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecurrenceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Tasks]
      summary: Set or replace a task's repeat rule
      description: |
        Root tasks only. Completing the task creates the next occurrence (copying
        title, description, priority, project, tags, custom fields, estimate,
        claim, and subtasks as incomplete) and moves the rule to it. Reopening
        within 15 minutes removes an untouched next occurrence. Requires the
        tasks:edit project permission.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRecurrenceInput"
      responses:
        "200":
          description: Updated recurrence detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecurrenceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      summary: Stop a task from repeating
      description: Removes the rule; past occurrences keep their series history.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Recurrence detail with recurrence null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecurrenceDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/tasks/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Tasks]
      summary: Task activity timeline
      description: Returns newest-first activity for a task, including title, estimate, priority, due date, parent, status, sprint, tag, and completion changes.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Events newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/project-roles:
    get:
      tags: [Projects]
      summary: List site-level project roles and the permission catalog
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Catalog plus site roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRolesList"

  /api/v2/organizations:
    get:
      tags: [Organizations]
      summary: List organizations the caller belongs to
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create an organization
      description: |
        Requires the orgs:create site permission (admins always have it). In company mode
        these are teams inside the company, and entering company mode removes orgs:create
        from the User site role.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/organizations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Organizations]
      summary: Get one organization
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Organizations]
      summary: Update organization name or description
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Organizations]
      summary: Delete an organization (owner). Linked projects become independent.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/organizations/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Organizations]
      summary: List organization members
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Organizations]
      summary: Invite a user by username
      description: Creates a pending invite. The user must accept before they become an organization member. Accepting does not add them to existing imported projects.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInviteCreate"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/organizations/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Organizations]
      summary: Change a member's organization role
      description: Updates the organization role and overwrites this member's role on imported-and-locked projects only. Unlocked imported projects keep their current project roles.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Organizations]
      summary: Remove a member or leave the organization
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/organizations/{id}/members/{userId}/project-impact:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: userId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [Organizations]
      summary: Preview which projects an organization role change would update
      description: Returns org-linked projects the member currently belongs to, split into imported-and-locked boards that would receive the new role and unlocked boards that would keep their current project role.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberRoleImpact"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/organizations/{id}/projects:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Organizations]
      summary: List attached projects and their members
      description: Returns organization-linked projects and the people currently on each board. Members are listed even when roles are locked.
      security:
        - SessionCookie: []
