            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/projects/{id}/statuses:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
