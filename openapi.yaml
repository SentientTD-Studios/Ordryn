      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/task-templates/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [Task Templates]
      summary: Replace a task template
      description: Allowed for the template's creator, or anyone with `project:manage` for a project template. `project_id` is ignored.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Task Templates]
      summary: Replace a task template (same as PUT)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskTemplate"
    delete:
      tags: [Task Templates]
      summary: Delete a task template
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/task-templates/{id}/apply:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Task Templates]
      summary: Create a task from a template
      description: >
        Creates the task and its subtasks. Project templates always create in their project; personal
        templates use `project_id` (omit for no project). Tags are matched by name in the target project
        and skipped when missing. A due offset sets the due date relative to today in the caller's timezone.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: { type: integer }
                sprint_id: { type: integer }
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/planner:
    get:
      tags: [Tasks]
      summary: Today / Upcoming planner
      description: |
        The caller's open tasks, grouped for a daily plan. "Your" tasks are the same set as the home
        list: personal tasks, classic project tasks you can edit, and kanban tasks you claimed.
        Dates use the caller's timezone. Sections: `overdue` (due before today), `due_today`,
        `woken` (a snooze ran out; the task stays here until completed or the snooze is cleared),
        `upcoming` (due within `days`, grouped by day), and `snoozed` (hidden until `snoozed_until`).
        A snoozed task is only in `snoozed` until its day, even when overdue. At most 500 tasks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: How many days ahead Upcoming covers (1-60, default 14).
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Planner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Planner"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v2/dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregate task stats for the current user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /api/v2/calendar/month:
