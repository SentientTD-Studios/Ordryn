    post:
      tags: [Organizations]
      summary: Reorder organization custom roles
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleReorder"
      responses:
        "200":
          description: Reordered
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Projects (active owned first by position, then shared, then archived)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        Requires the projects:create site permission (admins always have it). In company
        mode a project created without `organization_id` belongs to the company with only
        its creator as a member.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/projects/reorder:
    post:
      tags: [Projects]
      summary: Reorder owned projects
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids]
              properties:
                project_ids:
                  type: array
                  items:
                    type: integer
                  description: Full ordered list of active (non-archived) project IDs owned by the caller
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v2/projects/pins:
    put:
      tags: [Projects]
      summary: Set pinned projects
      description: >-
        Replaces the caller's pinned projects (shown at the top of the sidebar) with the given
        ordered list. Pins are per user and may include owned or shared projects. Send an empty
        array to unpin everything. Project lists report each project's `pinned` flag and `pin_position`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_ids]
              properties:
                project_ids:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: integer
                  description: Full ordered list of pinned project IDs; each must be a project the caller owns or is a member of
      responses:
        "200":
          description: Pins saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_ids:
                    type: array
                    items:
                      type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/by-slug/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Projects]
      summary: Look up a project by its current or former slug
      description: Former slugs (from renames) resolve to the project too. Projects the caller cannot access return 404.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: Get a project (owned or shared)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      summary: Update project name, description, workflow mode, and/or attach an organization (owner only)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cannot disable kanban while the project has tasks, or the slug is used by another project
    delete:
      tags: [Projects]
      summary: Delete a project (owner only)
      description: |
        Tasks normally outlive a deleted project with no project. On a company site, where
        every task needs a project, a project that still has tasks returns 409 (archive it
        instead); deleting an empty one also purges its trashed tasks.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

