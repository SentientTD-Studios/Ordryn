  /api/v2/mcp:
    post:
      tags: [AI Agents]
      summary: Model Context Protocol endpoint (agent and local agent keys)
      description: |
        MCP over the streamable HTTP transport, answering with plain JSON (no SSE
        stream). Supports `initialize`, `ping`, `tools/list`, and `tools/call`.

        AI agent keys get: get_agent_context, list_my_runs, start_run,
        finish_run, get_task, get_task_comments, list_tasks, add_comment,
        move_task, update_task, create_task.

        Local agent keys get get_context, get_project, get_task (with
        `include_comments`), get_task_comments, and list_tasks with `tasks:read`;
        update_task, move_task, create_task, and claim_task with `tasks:write`;
        and add_comment with `comments:write`. Tools outside the key's scopes are
        not listed. `task_id` also accepts `"#123"` or a `/tasks/123` link.

        Each tool is replayed through the REST API with the caller's key, so the
        same allowlist, scopes, guardrails, and rate limits apply; refusals come
        back as tool results with `isError: true`. Standard personal keys and
        project keys get 403.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
        "202":
          description: Notification accepted (no body)
        "403":
          $ref: "#/components/responses/Forbidden"

