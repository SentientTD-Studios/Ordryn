        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Tags]
      summary: Delete a tag
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/saved-views:
    get:
      tags: [Saved Views]
      summary: List saved views
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Saved views
