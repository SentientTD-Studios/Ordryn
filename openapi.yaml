      - $ref: "#/components/parameters/FeedbackPostID"
    post:
      tags: [Feedback]
      summary: Create a task from a submission, link it, and approve the submission (manage)
      description: Visitors then see the task's progress as the submission's status.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status_id:
                  type: integer
                  description: Optional board status for the new task (kanban projects)
      responses:
        "200":
          $ref: "#/components/responses/FeedbackPostResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/projects/{id}/feedback/posts/{postId}/link:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/FeedbackPostID"
    post:
      tags: [Feedback]
      summary: Link a submission to an existing task in the project and approve it (manage)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/FeedbackPostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/public/feedback/{slug}:
    parameters:
      - $ref: "#/components/parameters/FeedbackSlug"
    get:
      tags: [Feedback]
      summary: Public feedback board (no account)
      description: >
        Returns only `{locked: true}` until the visitor has unlocked the board with its password.
        Unknown, disabled and archived boards return 404. All public feedback endpoints are rate
        limited per IP, and writes also per visitor and per board.
      security: []
      responses:
        "200":
          description: Board view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFeedbackView"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/public/feedback/{slug}/unlock:
    parameters:
      - $ref: "#/components/parameters/FeedbackSlug"
    post:
      tags: [Feedback]
      summary: Unlock a feedback board with its password
      description: Sets an HttpOnly, SameSite=Strict cookie scoped to this board for 30 days.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: Unlocked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/public/feedback/{slug}/lock:
    parameters:
      - $ref: "#/components/parameters/FeedbackSlug"
    post:
      tags: [Feedback]
      summary: Sign out of a feedback board
      security: []
      responses:
        "204":
          description: Signed out
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/public/feedback/{slug}/posts:
    parameters:
      - $ref: "#/components/parameters/FeedbackSlug"
    post:
      tags: [Feedback]
      summary: Submit feedback (unlocked visitors)
      description: >
        The submission waits for review and is visible only to its author until approved.
        `form_token` comes from the board view and must be at least a few seconds old.
        `website` is a honeypot and must be empty.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, form_token]
              properties:
                title:
                  type: string
                  maxLength: 140
                body:
                  type: string
                  maxLength: 4000
                author_name:
                  type: string
                  maxLength: 60
                website:
                  type: string
                form_token:
                  type: string
      responses:
        "201":
          description: Submitted for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  state:
                    type: string
                    enum: [pending]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/public/feedback/{slug}/posts/{postId}/vote:
    parameters:
      - $ref: "#/components/parameters/FeedbackSlug"
      - $ref: "#/components/parameters/FeedbackPostID"
    post:
      tags: [Feedback]
      summary: Vote for an approved submission (unlocked visitors)
      security: []
      responses:
        "200":
          $ref: "#/components/responses/FeedbackVoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Feedback]
      summary: Remove your vote (unlocked visitors)
      security: []
      responses:
        "200":
          $ref: "#/components/responses/FeedbackVoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v2/tags:
    get:
      tags: [Tags]
      summary: List tags
      description: >
        Omit project_id to list personal tags plus tags on accessible projects.
        project_id=0 lists personal (inbox) tags. A positive project_id lists that project's tags.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
          description: 0 for personal tags, or a project id
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
    post:
      tags: [Tags]
      summary: Create a tag (or return existing by name in that namespace)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreateBody"
      responses:
        "201":
          description: Created or existing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Tags]
      summary: Update a tag
      description: >
        Change a tag's name and/or color. Omit a field to leave it unchanged.
        Protected system tags cannot be updated.
      security:
