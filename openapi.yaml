      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
    patch:
      tags: [Saved Views]
      summary: Partially update a saved view
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
