                  project_id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  is_active:
                    type: boolean
                  is_locked:
                    type: boolean
                  is_system:
                    type: boolean
                  task_count:
                    type: integer
        "400":
          description: Invalid request or attempt to set dates
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

