    TaskRecurrenceInput:
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
          minimum: 1
          maximum: 365
          default: 1
          description: Repeat every N days/weeks/months/years
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Weekly only. 0=Sunday … 6=Saturday. Defaults to the due date's weekday.
        month_day:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
          description: Monthly only. Days past the end of a month clamp to its last day (31 = last day). Defaults to the due date's day.
        basis:
          type: string
          enum: [due, completion]
          default: due
          description: |
            due schedules from the previous due date and skips missed occurrences so the
            next task is never overdue; completion schedules from the day the task was completed.
        ends_on:
          type: string
          format: date
          description: Stop creating occurrences after this date. Omit or empty for never.
        end_after:
          type: integer
          minimum: 0
          maximum: 1000
          nullable: true
          description: Total occurrences in the series including the first; 0/null = unlimited.

    TaskRecurrence:
      type: object
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, yearly]
        interval:
          type: integer
        weekdays:
          type: array
          items:
            type: integer
        month_day:
          type: integer
          nullable: true
        basis:
          type: string
          enum: [due, completion]
        ends_on:
          type: string
          format: date
          nullable: true
        end_after:
          type: integer
          nullable: true
        occurrence:
          type: integer
          description: 1-based position of this task in its series
        series_id:
          type: integer
          description: Id of the first task in the series
        summary:
          type: string
          example: Every 2 weeks on Mon, Thu
        next_due:
          type: string
          format: date
          description: Only on GET /tasks/{id}/recurrence — due date the next occurrence would get if completed today

