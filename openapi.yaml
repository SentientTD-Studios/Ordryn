                    type: boolean
                  added:
                    type: integer
                  project_ids:
                    type: array
                    items:
                      type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/organizations/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
