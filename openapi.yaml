  /api/v1/projects/{id}/sprints:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Projects]
      summary: List sprints for a kanban project
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Sprints (empty when project is classic)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSprint"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Projects]
      summary: Create a sprint (owner, kanban only, max 50)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 80
                  description: Optional short goal shown with the sprint name (e.g. "features required for v3.0.0 release")
                start_date:
                  type: string
                  format: date
                  description: Inclusive start (YYYY-MM-DD). Leave blank or omit for a dateless sprint (e.g. Icebox). For dated sprints, must not overlap another sprint in this project.
                end_date:
                  type: string
                  format: date
                  description: Inclusive end (YYYY-MM-DD). Leave blank or omit for a dateless sprint. Adjacent ranges (next day after another sprint ends) are allowed.
                lock_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. From this UTC date onward, only the project owner can add tasks to the sprint. Cannot be set on dateless sprints. Omit or null to leave the sprint unlocked.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSprint"
        "400":
          description: Invalid dates, inverted range, or overlap with another sprint
        "409":
          description: Sprint limit or name conflict

  /api/v1/projects/{id}/sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: sprintId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Projects]
      summary: Update a sprint (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 60
                description:
                  type: string
                  maxLength: 80
                  description: Optional short goal shown with the sprint name. Empty string clears it.
                start_date:
                  type: string
                  format: date
                  description: Inclusive start (YYYY-MM-DD). Must not overlap another sprint in this project.
                end_date:
                  type: string
                  format: date
                  description: Inclusive end (YYYY-MM-DD). Adjacent ranges are allowed.
                lock_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. From this UTC date onward, only the project owner can add tasks. Null or empty clears the lock date.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSprint"
    delete:
      tags: [Projects]
      summary: Delete a sprint (owner). Tasks go to backlog unless moved.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: move_to_sprint_id
          in: query
          schema:
            type: integer
          description: Optional destination sprint; 0 or omit leaves tasks in the backlog
      responses:
        "204":
          description: Deleted

  /api/v1/projects/{id}/sprints/backlog:
    parameters:
