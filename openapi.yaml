          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtensionsReloadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v2/admin/extensions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Admin]
      summary: Get one extension and its settings
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtension"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Admin]
      summary: Enable or disable an extension for the site
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminExtensionPatch"
      responses:
        "200":
          description: Updated extension
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExtension"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/admin/extensions/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Admin]
      summary: Send a test event to the site destination
      security:
        - SessionCookie: []
        - BearerAuth: []
