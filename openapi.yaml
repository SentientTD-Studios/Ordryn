    get:
      tags: [Projects]
      summary: Team dashboard metrics
      description: |
        Open/done/overdue counts, weekly throughput for the last 8 weeks, each member's claimed
        work and completions in the last 30 days, and (kanban projects) a burndown for a dated sprint.
        Any project member can read it. Without `sprint_id` the burndown uses the sprint running today,
        else the one that ended most recently, else the next to start. The burndown replays completed
        and reopened events over the sprint's current tasks, so work added mid-sprint counts from day one.
        Days after today have `null` remaining values.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: sprint_id
          in: query
          description: Dated sprint to chart.
          schema:
            type: integer
      responses:
