  /api/v2/saved-views/{id}/results:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Saved Views]
      summary: Run a saved query
      description: >
        Runs the query as the caller, never as its author: results only ever contain tasks the
        caller can open. References the caller cannot use (projects, organizations, sprints,
        people, or fields) match nothing and are listed under `unavailable`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page_size
          in: query
          description: 1-200 (default 50), or -1 to return only the total.
          schema: { type: integer }
      responses:
        "200":
          description: One page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResults"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/saved-views/{id}/export:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Saved Views]
      summary: Export a saved query's results as CSV
      description: Up to 5000 rows, one column per query column.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/saved-views/{id}/dashboard:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [Saved Views]
      summary: Pin a saved query to your dashboard
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Pinned
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Saved Views]
      summary: Unpin a saved query from your dashboard
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Unpinned
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/queries/run:
    post:
      tags: [Queries]
      summary: Run a query definition without saving it
      description: >
        Every project, sprint, person, and custom field the definition names must be one the caller
        can access; otherwise the request fails with `invalid_query` (the same error whether the
        thing is missing or hidden). Project-scoped API keys are always pinned to their project.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunRequest"
      responses:
        "200":
          description: One page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResults"
        "400":
          $ref: "#/components/responses/APIError"

  /api/v2/queries/export:
    post:
      tags: [Queries]
      summary: Export an unsaved query's results as CSV
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRunRequest"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/APIError"

  /api/v2/queries/options:
    get:
      tags: [Queries]
      summary: Fields, operators and picker values for the query editor
      description: Lists only projects the caller can open and the people, statuses, tags, sprints and custom fields inside them.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          description: Narrow every list to one project (the shared-query editor).
          schema: { type: integer }
      responses:
        "200":
          description: Editor options
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        type: { type: string }
                        operators: { type: array, items: { type: string } }
                        sortable: { type: boolean }
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              value: { type: string }
                              label: { type: string }
                  columns:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        archived: { type: boolean }
                        view_only: { type: boolean }
                        organization_id: { type: integer, nullable: true }
                  organizations:
                    type: array
                    description: >
                      Organizations you belong to: a query can search their projects
                      (`scope.organizations`) and be shared with their members. The
                      company of a company-mode site is left out; share site-wide instead.
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        can_manage_queries:
                          type: boolean
                          description: You may edit and delete any query shared with this organization.
                  can_share_site:
                    type: boolean
                    description: You hold `queries:site` and may share queries with everyone.
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  statuses: { type: array, items: { type: string } }
                  tags: { type: array, items: { type: string } }
                  sprints:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        project_id: { type: integer }
                        name: { type: string }
                        active: { type: boolean }
                  date_macros: { type: array, items: { type: string } }
                  limits: { type: object, additionalProperties: { type: integer } }

  /api/v2/task-templates:
    get:
      tags: [Task Templates]
      summary: List task templates
      description: The caller's personal templates, plus the shared templates of `project_id` when given.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: project_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskTemplate"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Task Templates]
      summary: Create a task template
      description: Omit `project_id` for a personal template. A project template needs `tasks:create` in that project.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
