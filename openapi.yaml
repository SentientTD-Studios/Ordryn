    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Projects]
      summary: Archive a project (owner only)
      description: >
        Moves the project out of active lists, applies the protected archived tag to
        its tasks, and prevents new tasks from being added. Existing tasks remain.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Projects]
      summary: Restore an archived project (owner only)
      description: >
        Returns the project to active lists, removes the protected archived tag from
        its tasks, and allows new tasks again.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

