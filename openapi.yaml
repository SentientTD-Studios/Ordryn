          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInviteCreate"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/organizations/{id}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: inviteId
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [Organizations]
      summary: Revoke a pending organization invite
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
