      summary: Update a status column (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                is_done:
                  type: boolean
                is_default:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatus"
    delete:
      tags: [Projects]
      summary: Delete a status column (owner)
      security:
        - SessionCookie: []
        - BearerAuth: []
