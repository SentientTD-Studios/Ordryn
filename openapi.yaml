  /api/v2/projects/{id}/agents:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [AI Agents]
      summary: List the project's AI agents (project:manage)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Agents, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AI Agents]
      summary: Add an AI agent member (project:manage)
      description: |
        Creates a bot account with the given @handle, adds it to the project with
        `role` (required: there is no default role; roles with project:manage are refused), and stores
        its triggers and guardrails. Defaults are conservative: triggered by
        @mention from managers, may edit only `status`, may comment, may not
        complete or create tasks, 20 runs per hour. At most 10 agents per project.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AgentInput"
                - type: object
                  required: [handle, role]
                  properties:
                    handle:
                      type: string
                      pattern: "^[A-Za-z0-9_]{3,32}$"
                      description: Username used for @mentions; must be unused site-wide
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/projects/{id}/agents/runs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [AI Agents]
      summary: Agent run history for the project (project:manage)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: agent_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 200
            default: 50
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}/agents/{agentId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [AI Agents]
      summary: Get one agent (project:manage)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [AI Agents]
      summary: Update an agent's settings, role, triggers, or guardrails (project:manage)
      description: Omitted fields keep their value. The handle cannot be changed.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [AI Agents]
      summary: Remove an agent (project:manage)
      description: |
        Removes the agent from the project, revokes its keys, cancels its open
        runs, and clears its claims. Its past comments and activity keep their author.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v2/projects/{id}/agents/{agentId}/keys:
    parameters:
      - $ref: "#/components/parameters/ID"
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [AI Agents]
      summary: List an agent's API keys (project:manage)
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Active keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectAPIKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [AI Agents]
      summary: Mint an API key that acts as the agent (project:manage)
      description: |
        Agent keys always carry tasks:read, tasks:write and comments:write; the
        agent's guardrails decide what those allow. They do not appear in
        `/projects/{id}/api-keys`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                  description: Defaults to "<handle> key"
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        "201":
          description: Key created; plaintext shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAPIKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/projects/{id}/agents/{agentId}/keys/{keyId}:
