              $ref: "#/components/schemas/ProjectRoleWrite"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/organizations/{id}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    patch:
      tags: [Organizations]
      summary: Update an organization role or customize a site default
      description: |
        For the owner role, only `name` is accepted. It renames Owner for the organization and every
        project in it (locked projects always follow it); Owner keeps every permission. Sending the
        site name clears the rename.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRolePatch"
      responses:
        "200":
          description: Updated organization role, or a new organization override when roleId is a site default (except owner)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRoleDef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Organizations]
      summary: Delete an unused organization role, or reset a site-role override
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted, or site-role override reset (members may still use the slug)
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v2/organizations/{id}/roles/reorder:
    parameters:
