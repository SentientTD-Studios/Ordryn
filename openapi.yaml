        "200":
          description: >
            Import completed. When the staged CSV included a `favorite` column, the
            response also has `Deprecation` and `Warning` headers and
            `deprecation_notice` in the body.
          headers:
            Deprecation:
              $ref: "#/components/headers/FavoriteDeprecation"
            Warning:
              $ref: "#/components/headers/FavoriteWarning"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/import/cancel:
    post:
      tags: [Import]
      summary: Discard the staged CSV import
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Staging cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v1/images:
    post:
      tags: [Images]
      summary: Upload an image
      description: |
        Stores an image using the admin-configured backend (`s3` or `local`).
        S3-compatible endpoints cover AWS S3, Cloudflare R2, DigitalOcean Spaces, and MinIO.
        Local uploads are served from `/uploads/{key}`.
        Disabled when `image_hosting_provider` is unset.
        Allowed types: JPEG, PNG, GIF, WebP. Size is capped by `image_max_bytes`.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUpload"
        "400":
          description: Not configured, missing file, or unsupported type
        "413":
          description: File exceeds image_max_bytes
        "502":
          description: Storage backend failed; message is generic for end users

  /api/v1/admin/image-hosting/test:
    post:
      tags: [Admin]
      summary: Test image hosting configuration
      description: |
        Uploads a tiny probe image using the submitted settings (falling back to
        the saved secret key when omitted), then deletes it. The JSON `message`
        is safe for site admins and does not include provider XML or secrets.
        End-user uploads never receive this diagnostic.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Probe finished (ok true or false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageHostingTestResult"
        "400":
          description: Provider unset or settings invalid

  /api/v1/announcements/dismiss:
    post:
      tags: [Announcements]
      summary: Dismiss the global announcement banner for this session
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v1/invites:
    get:
      tags: [Invites]
      summary: List invites
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
    post:
      tags: [Invites]
      summary: Create an invite
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /api/v1/invites/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      tags: [Invites]
      summary: Delete an unused invite
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "204":
          description: Deleted

  /api/v1/admin/settings:
    get:
      tags: [Admin]
      summary: Get site settings
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    patch:
      tags: [Admin]
      summary: Update site settings
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /api/v1/admin/users/{id}/ban:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Ban a user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Banned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v1/admin/users/{id}/unban:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Unban a user
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Unbanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OK"

  /api/v1/admin/users/{id}/username:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      tags: [Admin]
      summary: Set a user's username
      description: Clears username_change_available so the user is not stuck in the claim flow.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_name]
              properties:
                user_name:
                  type: string
                  minLength: 3
                  maxLength: 32
                  pattern: '^[A-Za-z0-9_]+$'
      responses:
        "200":
          description: Username updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  user_name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/admin/email-audit:
    get:
      tags: [Admin]
      summary: Query outbound email audit log
      description: |
        Lists recent outbound email attempts (success, failure, and not configured).
        Message bodies are never stored. Rows older than email_audit_retention_days are deleted automatically.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [sent, failed, not_configured]
        - name: trigger
          in: query
          schema:
            type: string
            enum: [password_reset, password_changed, site_invite, join_request, project_invite]
        - name: q
          in: query
          description: Case-insensitive substring match on recipient email
          schema:
            type: string
        - name: from
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive start)
          schema:
            type: string
        - name: to
          in: query
          description: RFC3339 timestamp or YYYY-MM-DD (inclusive end of day when a date)
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit rows, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailAuditList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/admin/comment-audit:
    get:
      tags: [Admin]
      summary: Query discussion comment audit log
      description: |
        Lists previous comment bodies captured when a comment was edited, deleted, or restored.
        Site admins can restore any revision.
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [edit, delete, restore]
        - name: q
          in: query
          description: Case-insensitive substring match on body, task title, project, or usernames
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Audit rows, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentAuditList"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/admin/comment-audit/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Restore a comment to a previous version
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Restored comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/join-requests:
    get:
      tags: [Admin]
      summary: List join requests
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Join requests (pending first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"

  /api/v1/admin/join-requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Approve a pending join request
      description: Creates or reuses a site invite and emails the requester.
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    $ref: "#/components/schemas/JoinRequest"
                  invite:
                    $ref: "#/components/schemas/Invite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/APIError"

  /api/v1/admin/join-requests/{id}/deny:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Admin]
      summary: Deny a pending join request
      security:
        - SessionCookie: []
        - BearerAuth: []
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  request:
                    $ref: "#/components/schemas/JoinRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/APIError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: API key from profile, bootstrap, or device auth
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: httpOnly session cookie from /api/v1/auth/login or register

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  headers:
    FavoriteDeprecation:
      description: >
        Set to `true` when the request used the deprecated `favorite` field.
        Task favoriting will be removed in API v4.
      schema:
        type: string
        example: "true"
    FavoriteWarning:
      description: >
        RFC 7234 miscellaneous persistent warning describing the favorite
        deprecation (`299 - "Task favoriting is deprecated and will be removed in API v4."`).
      schema:
        type: string
        example: '299 - "Task favoriting is deprecated and will be removed in API v4."'

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource is in a conflicting state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    APIError:
      description: API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code (e.g. invalid_request)
        message:
          type: string

    OK:
      type: object
      properties:
        ok:
          type: boolean

    TaskReorderResult:
      type: object
      properties:
        ok:
          type: boolean
        deprecation_notice:
          type: string
          description: >
            Present when reordering the deprecated favorite group (`favorite: true`).
            Favoriting will be removed in API v4.

    Health:
      type: object
      properties:
        version:
          type: string
          description: Application version (git release tag). Checkouts use the latest reachable tag; unstamped builds without git tags report "dev".
        api_enabled:
          type: boolean
        redis_ok:
          type: boolean
        mode:
          type: string
          enum: [full, api]

    SiteInfo:
      type: object
      properties:
        site_name:
          type: string
        show_changelog:
          type: boolean
        enable_global_announcement:
          type: boolean
        global_announcement_text:
          type: string
        announcement_dismissed:
          type: boolean
        enable_registration:
          type: boolean
        invite_only:
          type: boolean
        enable_join_requests:
          type: boolean
        meta_description:
          type: string
        github_oauth_configured:
          type: boolean
        image_hosting_enabled:
          type: boolean
          description: True when an admin has configured S3 or local image hosting
        image_max_bytes:
          type: integer
          format: int64
          description: Maximum upload size in bytes when image hosting is enabled

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        user_name:
          type: string
        timezone:
          type: string
        items_per_page:
          type: integer
        permissions:
          type: array
          items:
            type: string
        allow_project_invites:
          type: boolean
          description: When false, the user cannot be invited to shared projects
        username_change_available:
          type: boolean
          description: When true, the user may call POST /api/v1/me/username once
        mfa_enabled:
          type: boolean
          description: When true, password login requires a TOTP or recovery code
        avatar_url:
          type: string
          description: URL to user's uploaded profile picture, or empty if unset

    MFARequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required:
          type: boolean
          enum: [true]

    MFAStatus:
      type: object
      properties:
        enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer

    MFASetup:
      type: object
      properties:
        secret:
          type: string
        otpauth_url:
          type: string
          format: uri

    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP or a recovery code (XXXXX-XXXXX)

    MFARecoveryCodes:
      type: object
      properties:
        recovery_codes:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string

    UserSearchHit:
      type: object
      required: [user_name]
      properties:
        user_name:
          type: string

    UserPatch:
      type: object
      properties:
        timezone:
          type: string
        items_per_page:
          type: integer
          enum: [10, 15, 25, 50]
        allow_project_invites:
          type: boolean

    RegisterRequest:
      type: object
      required: [email, password, confirm_password, user_name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        confirm_password:
          type: string
        user_name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
          description: Unique username; immutable after registration except by admin
        timezone:
          type: string
        invite_token:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string

    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Plaintext key; shown only once

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
          maxLength: 20
          description: CSS color used for chips and board labels (for example #0d6efd)
        project_id:
          type: integer
          nullable: true
          description: Null for personal (inbox) tags
        protected:
          type: boolean
          description: True for system tags such as removed and archived

    TagCreateBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        project_id:
          type: integer
          nullable: true
          description: Omit, null, or 0 for a personal tag; a project id for a project tag

    TagPatch:
      type: object
      description: At least one of name or color is required.
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 20
          description: CSS color (for example #dc3545). Omit to keep the current color.

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          maxLength: 1000
          description: Optional project details
        workflow_mode:
          type: string
          enum: [classic, kanban]
          description: Opt-in board workflow; classic keeps boolean completed only
        archived:
          type: boolean
          description: When true, the project is in the Archived section and cannot accept new tasks
        backlog_name:
          type: string
          maxLength: 60
          description: Custom name for the project's backlog system sprint (default "Backlog")
        backlog_description:
          type: string
          maxLength: 80
          description: Optional description for the project's backlog system sprint
        role:
          type: string
          enum: [owner, editor, viewer]
        owner_email:
          type: string
        owner_user_name:
          type: string
        owner_user_id:
          type: integer

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000

    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000
        workflow_mode:
          type: string
          enum: [classic, kanban]
        backlog_name:
          type: string
          maxLength: 60
          description: Rename the project's backlog system sprint
        backlog_description:
          type: string
          maxLength: 80
          description: Update the project's backlog system sprint description
      description: At least one field required. Disabling kanban fails with 409 if the project has tasks.

    ProjectStatus:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        position:
          type: integer
        is_done:
          type: boolean
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProjectSprint:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        description:
          type: string
          maxLength: 80
          description: Optional short goal shown with the sprint name
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: Inclusive range; sprints in a project must not overlap
        lock_date:
          type: string
          format: date
          nullable: true
          description: Optional. From this UTC date onward, only the project owner can add tasks
        is_active:
          type: boolean
          description: True when today's UTC date falls in start_date..end_date inclusive
        is_locked:
          type: boolean
          description: True when lock_date is set and today's UTC date is on or after lock_date
        task_count:
          type: integer
        created_at:
          type: string
          format: date-time

    TaskTimeEntry:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        minutes:
          type: integer
        note:
          type: string
        created_at:
          type: string
          format: date-time
        user_email:
          type: string
        user_name:
          type: string

    TaskComment:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        avatar_url:
          type: string
          description: URL to comment author's avatar picture, or empty if unset
        body:
          type: string
          description: Empty when the comment has been deleted
        created_at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          description: Set when the comment has been edited or restored
        edited_by_user_id:
          type: integer
        edited_by_user_name:
          type: string
        deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
        deleted_by_user_id:
          type: integer
        deleted_by_kind:
          type: string
          enum: [user, owner]
        links:
          type: array
          description: Tasks referenced in the body that the current user can access
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string

    TaskCommentRevision:
      type: object
      properties:
        id:
          type: integer
        comment_id:
          type: integer
        task_id:
          type: integer
        body:
          type: string
          description: Previous comment content captured before the change
        kind:
          type: string
          enum: [edit, delete, restore]
        created_at:
          type: string
          format: date-time
        edited_by_user_id:
          type: integer
        edited_by_user_name:
          type: string
        author_user_id:
          type: integer
        author_user_name:
          type: string
        task_title:
          type: string
        project_id:
          type: integer
        project_name:
          type: string
        comment_deleted:
          type: boolean
        current_body:
          type: string

    CommentAuditList:
