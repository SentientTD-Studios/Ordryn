      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 20
          description: CSS color (for example #dc3545). Omit to keep the current color.

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          maxLength: 1000
          description: Optional project details
        workflow_mode:
          type: string
          enum: [classic, kanban]
          description: Opt-in board workflow; classic keeps boolean completed only
        archived:
          type: boolean
          description: When true, the project is in the Archived section and cannot accept new tasks
        backlog_name:
          type: string
          maxLength: 60
          description: Custom name for the project's backlog system sprint (default "Backlog")
        backlog_description:
          type: string
          maxLength: 80
          description: Optional description for the project's backlog system sprint
        auto_create_next_sprint:
          type: boolean
          description: When true, automatically create the next sprint after the current dated sprint ends, if that sprint still has tasks
        auto_sprint_length_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
          description: Inclusive length in days of automatically created sprints
        auto_sprint_lock_days_before:
          type: integer
          nullable: true
          minimum: 0
          description: Optional days before the new sprint ends to set its lock date
        role:
          type: string
          description: Membership slug (owner, editor, viewer, developer, qa, or a custom role)
        role_name:
          type: string
          description: Human-readable role label, for example Owner or Developer II
        permissions:
          type: array
          items:
            type: string
          description: Effective permission ids for the caller's membership role
        owner_email:
          type: string
        owner_user_name:
          type: string
        owner_user_id:
          type: integer
        organization_id:
          type: integer
          nullable: true
          description: Organization this project imported members from
        organization_name:
          type: string
        org_managed:
          type: boolean
          description: When true, imported members and roles are locked to the organization. Organization role changes update this board, and project sharing/roles cannot be edited here.
        slug:
          type: string
          description: Site-unique URL name used in /p/{slug}. Set from the name at creation; does not follow renames.
        pinned:
          type: boolean
          description: True when the caller pinned this project to their sidebar (set on GET /api/v2/projects)
        pin_position:
          type: integer
          description: Order among the caller's pinned projects (0 first); omitted when not pinned

    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000
        organization_id:
          type: integer
          description: When set, import organization members onto the new project. Combine with org_import.
        org_import:
          type: string
          enum: [copy, lock, select]
          description: copy imports all members and leaves roles editable. lock imports all members and locks roles to the organization. select imports only org_import_members (each requires a role).
        org_import_members:
          type: array
          items:
            $ref: "#/components/schemas/OrgImportMember"

    ProjectPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: string
          maxLength: 1000
        workflow_mode:
          type: string
          enum: [classic, kanban]
        backlog_name:
          type: string
          maxLength: 60
          description: Rename the project's backlog system sprint
        backlog_description:
          type: string
          maxLength: 80
          description: Update the project's backlog system sprint description
        auto_create_next_sprint:
          type: boolean
          description: Enable automatic creation of the next sprint when the current dated sprint ends (kanban only; skipped if that sprint has no tasks)
        auto_sprint_length_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
          description: Inclusive length in days of automatically created sprints. Required when auto_create_next_sprint is true.
        auto_sprint_lock_days_before:
          type: integer
          nullable: true
          minimum: 0
          description: Days before the automatic sprint end to set lock_date. Null clears the lock. Must be less than auto_sprint_length_days.
        organization_id:
          type: integer
          description: Attach an organization the caller can manage. Non-imported people are removed and pending invites are cancelled. Use org_import to choose copy, lock, or select.
        org_import:
          type: string
          enum: [copy, lock, select]
          description: copy imports all members and leaves roles editable. lock imports all members and locks roles to the organization. select imports only org_import_members (each requires a role).
        org_import_members:
          type: array
          items:
            $ref: "#/components/schemas/OrgImportMember"
        slug:
          type: string
          minLength: 2
          maxLength: 48
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Change the project's URL name (project managers). Lowercased; may not be only digits. The previous slug keeps resolving via GET /api/v2/projects/by-slug/{slug}. 409 when another project uses it.
      description: At least one field required. Disabling kanban fails with 409 if the project has tasks.

    ProjectStatus:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        position:
          type: integer
        is_done:
          type: boolean
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        enter_role_slugs:
          type: array
          items:
            type: string
          description: If non-empty, only these roles (plus owner/admin) may move a task into this status
        leave_role_slugs:
          type: array
          items:
            type: string
          description: If non-empty, only these roles (plus owner/admin) may move a task out of this status
        wip_limit:
          type: integer
          nullable: true
          description: Soft limit on cards in the column (1-999). Null means no limit; done columns never have one. The board highlights a column over its limit but never blocks moves.
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        name:
          type: string
        description:
          type: string
          maxLength: 80
          description: Optional short goal shown with the sprint name
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: Inclusive range; sprints in a project must not overlap
        lock_date:
          type: string
          format: date
          nullable: true
          description: Optional. From this UTC date onward, only the project owner can add tasks
        is_active:
          type: boolean
          description: True when today's UTC date falls in start_date..end_date inclusive
        is_locked:
          type: boolean
          description: True when lock_date is set and today's UTC date is on or after lock_date
