      summary: Ask a project member to review a task
      description: |
        Sets the task's reviewer. Needs `tasks:edit` on the task's project. Works on
        classic and kanban project tasks; personal tasks can't have a reviewer.
        The reviewer must be a person (not an AI agent) who can see the task. They
        get a "Review requested" notification (unless they set it themselves or
        turned review requests off) and start watching the task. Fires
        `task.updated` with `reviewer_id` in the changed fields. Setting the
        current reviewer again is a no-op.
      security:
        - SessionCookie: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Give `user_id`, or `user_name` when `user_id` is omitted or 0.
              properties:
                user_id:
                  type: integer
                  minimum: 1
                user_name:
                  type: string
                  description: Username, with or without a leading `@`.
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tasks]
      summary: Remove a task's reviewer
      description: |
