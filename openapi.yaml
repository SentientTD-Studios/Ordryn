                name:
                  type: string
                  maxLength: 40
                is_done:
                  type: boolean
                is_default:
                  type: boolean
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStatus"
        "409":
          description: Status limit or name conflict

  /api/v1/projects/{id}/statuses/reorder:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Projects]
      summary: Reorder status columns (owner, kanban only)
