                $ref: "#/components/schemas/TaskGitHubIssue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/APIError"
    delete:
      tags: [GitHub]
      summary: Unlink GitHub issue from task (does not delete the issue on GitHub)
